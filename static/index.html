<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Flow Voice</title>
    <style>
      :root {
        --bg: #10140f;
        --panel: rgba(249, 244, 229, 0.92);
        --panel-strong: #fff8e8;
        --ink: #172016;
        --muted: #69705d;
        --accent: #d9ff70;
        --accent-strong: #3d5a21;
        --danger: #c4533c;
        --line: rgba(23, 32, 22, 0.12);
        --shadow: rgba(6, 11, 5, 0.28);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100dvh;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 0%, rgba(217, 255, 112, 0.32), transparent 18rem),
          radial-gradient(circle at 92% 12%, rgba(104, 167, 255, 0.18), transparent 16rem),
          linear-gradient(155deg, #11180f 0%, #1e2819 42%, #0c100b 100%);
        font-family: "Aptos Display", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
      }

      main {
        min-height: 100dvh;
        display: grid;
        padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }

      .shell {
        position: relative;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 16px;
        width: min(100%, 760px);
        min-height: calc(100dvh - 34px);
        margin: auto;
        overflow: hidden;
        border: 1px solid rgba(249, 244, 229, 0.22);
        border-radius: 34px;
        padding: 18px;
        background:
          linear-gradient(145deg, rgba(255, 248, 232, 0.96), rgba(239, 229, 203, 0.88)),
          var(--panel);
        box-shadow: 0 30px 90px var(--shadow);
      }

      .shell::before {
        content: "";
        position: absolute;
        inset: -36% 20% auto -20%;
        height: 280px;
        pointer-events: none;
        background: radial-gradient(circle, rgba(217, 255, 112, 0.58), transparent 65%);
        filter: blur(6px);
      }

      header {
        position: relative;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
      }

      .brand {
        display: grid;
        gap: 6px;
      }

      .eyebrow {
        width: fit-content;
        border: 1px solid rgba(61, 90, 33, 0.24);
        border-radius: 999px;
        padding: 6px 10px;
        color: var(--accent-strong);
        background: rgba(217, 255, 112, 0.38);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(38px, 13vw, 78px);
        line-height: 0.86;
        letter-spacing: -0.08em;
      }

      .status {
        flex: 0 0 auto;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 9px 12px;
        color: var(--muted);
        background: rgba(255, 248, 232, 0.78);
        font: 800 12px/1.1 "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.56);
      }

      .status[data-state="connected"] {
        color: #255b2e;
        background: rgba(217, 255, 112, 0.5);
      }

      .status[data-state="error"] {
        color: var(--danger);
        background: rgba(196, 83, 60, 0.1);
      }

      .composer {
        position: relative;
        display: grid;
        min-height: 0;
      }

      textarea {
        width: 100%;
        min-height: 48dvh;
        resize: none;
        border: 1px solid rgba(23, 32, 22, 0.14);
        border-radius: 30px;
        outline: none;
        padding: 22px;
        color: var(--ink);
        background:
          linear-gradient(rgba(255, 248, 232, 0.86), rgba(255, 248, 232, 0.86)),
          radial-gradient(circle at 100% 0%, rgba(217, 255, 112, 0.22), transparent 16rem);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.72),
          0 18px 48px rgba(69, 50, 22, 0.12);
        font: 500 clamp(23px, 6vw, 34px)/1.42 "LXGW WenKai", "STKaiti", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      textarea::placeholder {
        color: rgba(23, 32, 22, 0.34);
      }

      textarea:focus {
        border-color: rgba(61, 90, 33, 0.42);
        box-shadow:
          0 0 0 5px rgba(217, 255, 112, 0.22),
          0 18px 48px rgba(69, 50, 22, 0.12);
      }

      .toolbar {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      button {
        min-height: 54px;
        border: 1px solid var(--line);
        border-radius: 20px;
        color: var(--ink);
        background: rgba(255, 248, 232, 0.76);
        font: 900 16px/1 "Segoe UI", "PingFang SC", sans-serif;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.58);
      }

      button.primary {
        border-color: transparent;
        color: #152011;
        background: var(--accent);
      }

      @media (max-width: 430px) {
        .shell {
          border-radius: 28px;
          padding: 14px;
        }

        header {
          align-items: center;
        }

        .eyebrow {
          display: none;
        }

        .status {
          padding: 8px 10px;
        }

        textarea {
          min-height: 54dvh;
          border-radius: 24px;
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="shell">
        <header>
          <div class="brand">
            <div class="eyebrow">LIVE INPUT</div>
            <h1>Flow Voice</h1>
          </div>
          <div id="status" class="status" data-state="idle">连接中</div>
        </header>

        <div class="composer">
          <textarea id="input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="开始输入"></textarea>
        </div>

        <div class="toolbar">
          <button id="clear" type="button">清空</button>
          <button id="reconnect" class="primary" type="button">重连</button>
        </div>
      </section>
    </main>

    <script>
      const statusEl = document.querySelector("#status");
      const inputEl = document.querySelector("#input");
      const clearButton = document.querySelector("#clear");
      const reconnectButton = document.querySelector("#reconnect");
      const params = new URLSearchParams(location.search);
      const token = params.get("token") || "";

      let ws = null;
      let seq = 0;
      let queue = [];
      let reconnectTimer = null;
      let lastSentText = "";
      let lastExplicitBackspaceAt = 0;

      function setStatus(text, state = "idle") {
        statusEl.textContent = text;
        statusEl.dataset.state = state;
      }

      function socketUrl() {
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        return `${protocol}//${location.host}/ws?token=${encodeURIComponent(token)}`;
      }

      function sendMessage(message) {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          queue.push(message);
          setStatus("离线", "error");
          return;
        }
        ws.send(JSON.stringify(message));
      }

      function flushQueue() {
        const pending = queue;
        queue = [];
        for (const item of pending) {
          sendMessage(item);
        }
      }

      function syncNow() {
        if (inputEl.value === lastSentText) {
          return;
        }
        lastSentText = inputEl.value;
        sendMessage({
          type: "sync_text",
          token,
          seq: ++seq,
          text: inputEl.value,
        });
      }

      function resetSession() {
        sendMessage({
          type: "reset_session",
          token,
          seq: ++seq,
        });
      }

      function sendExplicitBackspace() {
        sendMessage({
          type: "ops",
          token,
          seq: ++seq,
          ops: [{ type: "backspace", count: 1 }],
        });
      }

      function maybeSendEmptyBackspace(event) {
        const isKeyboardBackspace = event.key === "Backspace";
        const isInputBackspace = event.inputType === "deleteContentBackward";
        if (!isKeyboardBackspace && !isInputBackspace) {
          return;
        }
        if (inputEl.value.length > 0 || inputEl.selectionStart !== 0 || inputEl.selectionEnd !== 0) {
          return;
        }
        const now = performance.now();
        if (now - lastExplicitBackspaceAt < 80) {
          event.preventDefault();
          return;
        }
        lastExplicitBackspaceAt = now;
        event.preventDefault();
        sendExplicitBackspace();
      }

      function connect() {
        clearTimeout(reconnectTimer);
        if (ws) {
          ws.close();
        }

        setStatus("连接中", "idle");
        ws = new WebSocket(socketUrl());

        ws.addEventListener("open", () => {
          setStatus("在线", "connected");
          flushQueue();
          inputEl.focus();
        });

        ws.addEventListener("message", (event) => {
          try {
            const message = JSON.parse(event.data);
            if (message.type === "error") {
              setStatus("错误", "error");
            }
          } catch (_) {
            // Ignore non-JSON diagnostics.
          }
        });

        ws.addEventListener("close", () => {
          setStatus("断开", "error");
          reconnectTimer = setTimeout(connect, 1200);
        });

        ws.addEventListener("error", () => {
          setStatus("错误", "error");
        });
      }

      inputEl.addEventListener("keydown", maybeSendEmptyBackspace);
      inputEl.addEventListener("beforeinput", maybeSendEmptyBackspace);
      inputEl.addEventListener("input", syncNow);

      clearButton.addEventListener("click", () => {
        inputEl.value = "";
        lastSentText = "";
        resetSession();
        inputEl.focus();
      });

      reconnectButton.addEventListener("click", connect);

      connect();
    </script>
  </body>
</html>
