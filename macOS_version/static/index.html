<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>手机实时输入</title>
    <style>
      :root {
        --bg: #f4efe6;
        --panel: #fffaf1;
        --ink: #211a12;
        --muted: #766a5b;
        --accent: #0f6b5f;
        --danger: #b6412d;
        --line: #dccfbc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        color: var(--ink);
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
        background:
          radial-gradient(circle at 18% 8%, rgba(15, 107, 95, 0.16), transparent 28rem),
          linear-gradient(145deg, #f8f0df, var(--bg) 48%, #e9ddca);
      }

      main {
        display: flex;
        min-height: 100dvh;
        align-items: stretch;
        padding: 18px;
      }

      .shell {
        display: flex;
        width: 100%;
        flex-direction: column;
        gap: 14px;
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 18px;
        background: rgba(255, 250, 241, 0.86);
        box-shadow: 0 20px 70px rgba(72, 52, 28, 0.16);
        backdrop-filter: blur(12px);
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      h1 {
        margin: 0;
        font-size: clamp(24px, 7vw, 42px);
        letter-spacing: -0.06em;
        line-height: 0.92;
      }

      .status {
        flex: 0 0 auto;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 12px;
        color: var(--muted);
        font: 600 13px/1.1 ui-monospace, "Cascadia Mono", Consolas, monospace;
        background: #fff7e9;
      }

      .status[data-state="connected"] {
        color: var(--accent);
      }

      .status[data-state="error"] {
        color: var(--danger);
      }

      textarea {
        width: 100%;
        min-height: 58dvh;
        flex: 1;
        resize: none;
        border: 1px solid var(--line);
        border-radius: 22px;
        outline: none;
        padding: 18px;
        color: var(--ink);
        font: 24px/1.55 "LXGW WenKai", "STKaiti", KaiTi, "Songti SC", serif;
        background:
          linear-gradient(rgba(255, 250, 241, 0.93), rgba(255, 250, 241, 0.93)),
          repeating-linear-gradient(to bottom, transparent 0 36px, rgba(15, 107, 95, 0.08) 37px);
      }

      textarea:focus {
        border-color: rgba(15, 107, 95, 0.58);
        box-shadow: 0 0 0 4px rgba(15, 107, 95, 0.08);
      }

      .toolbar {
        display: flex;
        gap: 10px;
      }

      button {
        min-height: 48px;
        flex: 1;
        border: 1px solid var(--line);
        border-radius: 16px;
        color: var(--ink);
        font: 700 16px/1 system-ui, sans-serif;
        background: #fff7e9;
      }

      button.primary {
        border-color: transparent;
        color: #fffaf1;
        background: var(--accent);
      }

      button.voice[data-recording="true"] {
        border-color: transparent;
        color: #fffaf1;
        background: var(--danger);
      }

      .hint {
        margin: 0;
        color: var(--muted);
        font: 14px/1.45 system-ui, sans-serif;
      }

      .cert-links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        color: var(--muted);
        font: 14px/1.45 system-ui, sans-serif;
      }

      .cert-links a {
        color: var(--accent);
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="shell">
        <header>
          <h1>实时输入</h1>
          <div id="status" class="status" data-state="idle">连接中</div>
        </header>

        <textarea id="input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="在这里输入或使用手机语音输入法，电脑光标处会实时出现同样的变化。"></textarea>

        <div class="toolbar">
          <button id="voice" class="voice" type="button" data-recording="false">开启语音输入</button>
          <button id="clear" type="button">清空手机输入框</button>
          <button id="reconnect" class="primary" type="button">重新连接</button>
        </div>

        <p class="hint">使用前先把电脑光标放到目标输入位置。不要关闭本页；本页不会要求点击发送。</p>
        <div class="cert-links">
          <span id="securityHint">语音输入需要 HTTPS 页面。</span>
          <a href="/cert/ca.crt">下载证书</a>
          <a href="/cert/help">安装说明</a>
        </div>
      </section>
    </main>

    <script>
      const statusEl = document.querySelector("#status");
      const inputEl = document.querySelector("#input");
      const voiceButton = document.querySelector("#voice");
      const clearButton = document.querySelector("#clear");
      const reconnectButton = document.querySelector("#reconnect");
      const securityHint = document.querySelector("#securityHint");
      const params = new URLSearchParams(location.search);
      const token = params.get("token") || "";

      let ws = null;
      let seq = 0;
      let queue = [];
      let reconnectTimer = null;
      let lastSentText = "";
      let asrWs = null;
      let audioContext = null;
      let mediaStream = null;
      let processor = null;
      let source = null;
      let recording = false;
      let pcmBuffer = [];
      let chunkSamples = 1600;

      function setStatus(text, state = "idle") {
        statusEl.textContent = text;
        statusEl.dataset.state = state;
      }

      function socketUrl() {
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        return `${protocol}//${location.host}/ws?token=${encodeURIComponent(token)}`;
      }

      function asrSocketUrl(sampleRate) {
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        return `${protocol}//${location.host}/asr_ws?token=${encodeURIComponent(token)}&sample_rate=${encodeURIComponent(sampleRate)}`;
      }

      function sendMessage(message) {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          queue.push(message);
          setStatus("离线缓存", "error");
          return;
        }
        ws.send(JSON.stringify(message));
      }

      function flushQueue() {
        const pending = queue;
        queue = [];
        for (const item of pending) {
          sendMessage(item);
        }
      }

      function syncNow() {
        if (inputEl.value === lastSentText) {
          return;
        }
        lastSentText = inputEl.value;
        sendMessage({
          type: "sync_text",
          token,
          seq: ++seq,
          text: inputEl.value,
        });
      }

      function resetSession() {
        sendMessage({
          type: "reset_session",
          token,
          seq: ++seq,
        });
      }

      function setVoiceButton(isRecording) {
        voiceButton.dataset.recording = String(isRecording);
        voiceButton.textContent = isRecording ? "停止语音输入" : "开启语音输入";
      }

      function updateSecurityState() {
        if (location.protocol === "https:") {
          securityHint.textContent = "当前是 HTTPS，浏览器可以请求麦克风权限。";
          voiceButton.disabled = false;
          return;
        }
        securityHint.textContent = "当前是 HTTP，手机浏览器会禁止网页录音；请安装证书后用 HTTPS 地址打开。";
        voiceButton.disabled = true;
        voiceButton.title = "语音输入需要 HTTPS";
      }

      function floatToPcm16(samples) {
        const buffer = new ArrayBuffer(samples.length * 2);
        const view = new DataView(buffer);
        for (let i = 0; i < samples.length; i += 1) {
          const sample = Math.max(-1, Math.min(1, samples[i]));
          view.setInt16(i * 2, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
        }
        return buffer;
      }

      function sendAudioSamples(samples) {
        for (const sample of samples) {
          pcmBuffer.push(sample);
        }
        while (pcmBuffer.length >= chunkSamples) {
          const chunk = pcmBuffer.splice(0, chunkSamples);
          if (asrWs && asrWs.readyState === WebSocket.OPEN) {
            asrWs.send(floatToPcm16(chunk));
          }
        }
      }

      function handleAsrMessage(event) {
        try {
          const message = JSON.parse(event.data);
          if (message.type === "asr_started") {
            setStatus("语音识别中", "connected");
          } else if (message.type === "asr_result") {
            if (message.sentence_end) {
              inputEl.value = message.text || "";
              lastSentText = inputEl.value;
            }
            setStatus(message.sentence_end ? "语音句子完成" : "语音识别中", "connected");
          } else if (message.type === "asr_finished") {
            setStatus("语音已停止", "connected");
          } else if (message.type === "asr_error") {
            setStatus("语音识别错误", "error");
            console.error(message.message);
          }
        } catch (error) {
          console.error(error);
        }
      }

      async function startVoiceInput() {
        if (recording) {
          return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setStatus("浏览器不支持录音", "error");
          return;
        }

        setStatus("请求麦克风", "idle");
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false,
          },
        });

        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioContextClass();
        await audioContext.resume();
        chunkSamples = Math.max(1, Math.round(audioContext.sampleRate / 10));

        asrWs = new WebSocket(asrSocketUrl(audioContext.sampleRate));
        asrWs.binaryType = "arraybuffer";

        await new Promise((resolve, reject) => {
          asrWs.addEventListener("open", resolve, { once: true });
          asrWs.addEventListener("error", reject, { once: true });
        });

        asrWs.addEventListener("message", handleAsrMessage);
        asrWs.addEventListener("close", () => {
          if (recording) {
            stopVoiceInput(false);
          }
        });

        source = audioContext.createMediaStreamSource(mediaStream);
        processor = audioContext.createScriptProcessor(4096, 1, 1);
        processor.onaudioprocess = (event) => {
          if (!recording) {
            return;
          }
          const input = event.inputBuffer.getChannelData(0);
          sendAudioSamples(input);
        };
        source.connect(processor);
        processor.connect(audioContext.destination);

        inputEl.value = "";
        lastSentText = "";
        recording = true;
        pcmBuffer = [];
        setVoiceButton(true);
        resetSession();
        setStatus("语音启动中", "idle");
      }

      async function stopVoiceInput(sendFinish = true) {
        recording = false;
        setVoiceButton(false);
        if (sendFinish && asrWs && asrWs.readyState === WebSocket.OPEN) {
          if (pcmBuffer.length > 0) {
            asrWs.send(floatToPcm16(pcmBuffer));
            pcmBuffer = [];
          }
          asrWs.send(JSON.stringify({ type: "finish_asr" }));
        }
        if (processor) {
          processor.disconnect();
          processor.onaudioprocess = null;
          processor = null;
        }
        if (source) {
          source.disconnect();
          source = null;
        }
        if (mediaStream) {
          mediaStream.getTracks().forEach((track) => track.stop());
          mediaStream = null;
        }
        if (audioContext) {
          await audioContext.close();
          audioContext = null;
        }
        setStatus("语音已停止", "connected");
      }

      function connect() {
        clearTimeout(reconnectTimer);
        if (ws) {
          ws.close();
        }

        setStatus("连接中", "idle");
        ws = new WebSocket(socketUrl());

        ws.addEventListener("open", () => {
          setStatus("已连接", "connected");
          flushQueue();
          inputEl.focus();
        });

        ws.addEventListener("message", (event) => {
          try {
            const message = JSON.parse(event.data);
            if (message.type === "error") {
              setStatus("电脑端错误", "error");
            }
          } catch (_) {
            // Ignore non-JSON diagnostics.
          }
        });

        ws.addEventListener("close", () => {
          setStatus("已断开", "error");
          reconnectTimer = setTimeout(connect, 1200);
        });

        ws.addEventListener("error", () => {
          setStatus("连接错误", "error");
        });
      }

      inputEl.addEventListener("input", syncNow);

      clearButton.addEventListener("click", () => {
        inputEl.value = "";
        lastSentText = "";
        resetSession();
        inputEl.focus();
      });

      voiceButton.addEventListener("click", async () => {
        try {
          if (recording) {
            await stopVoiceInput();
          } else {
            await startVoiceInput();
          }
        } catch (error) {
          console.error(error);
          setStatus("语音启动失败", "error");
          await stopVoiceInput(false);
        }
      });

      reconnectButton.addEventListener("click", connect);

      updateSecurityState();
      connect();
    </script>
  </body>
</html>
