<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <link rel="icon" href="data:," />
    <title>Mobile Remote Bridge</title>
    <style>
      :root {
        --stage-left: 0px;
        --stage-top: 0px;
        --stage-width: 100vw;
        --stage-height: 100vh;
        --ink: #111;
        --line: rgba(0, 0, 0, 0.14);
        --panel: rgba(255, 255, 255, 0.94);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f3f4f6;
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        touch-action: none;
        overscroll-behavior: none;
      }

      #stage {
        position: fixed;
        left: var(--stage-left);
        top: var(--stage-top);
        width: var(--stage-width);
        height: var(--stage-height);
        background: #fff;
        box-shadow: 0 0 0 1px var(--line), 0 12px 34px rgba(0, 0, 0, 0.08);
        touch-action: none;
      }

      #ink {
        display: block;
        width: 100%;
        height: 100%;
        background: #fff;
        cursor: crosshair;
        touch-action: none;
      }

      .toolbar {
        position: fixed;
        left: max(12px, env(safe-area-inset-left));
        top: max(12px, env(safe-area-inset-top));
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 8px;
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        backdrop-filter: blur(14px);
      }

      .draw-area-overlay {
        position: fixed;
        z-index: 4;
        border: 2px dashed rgba(25, 113, 194, 0.88);
        background: rgba(25, 113, 194, 0.06);
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.06);
        pointer-events: none;
      }

      .draw-area-overlay[hidden] {
        display: none;
      }

      .draw-area-overlay.editing {
        pointer-events: auto;
        touch-action: none;
      }

      .draw-handle {
        position: absolute;
        width: 18px;
        height: 18px;
        border: 2px solid #1971c2;
        border-radius: 5px;
        background: #fff;
      }

      .draw-handle[data-handle="nw"] {
        left: -10px;
        top: -10px;
      }

      .draw-handle[data-handle="ne"] {
        right: -10px;
        top: -10px;
      }

      .draw-handle[data-handle="sw"] {
        left: -10px;
        bottom: -10px;
      }

      .draw-handle[data-handle="se"] {
        right: -10px;
        bottom: -10px;
      }

      .tool-layer {
        position: fixed;
        inset: 0;
        z-index: 6;
        pointer-events: none;
      }

      .tool-button {
        position: fixed;
        left: 12px;
        top: 12px;
        z-index: 6;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        min-width: 0;
        padding: 0;
        pointer-events: auto;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.12);
      }

      .tool-button svg {
        width: 62%;
        height: 62%;
        pointer-events: none;
      }

      .pen-size-toggle {
        position: absolute;
        right: 2px;
        bottom: 2px;
        display: grid;
        place-items: center;
        width: 15px;
        height: 15px;
        border-radius: 5px;
        color: inherit;
        background: rgba(255, 255, 255, 0.82);
        font-size: 11px;
        line-height: 1;
        pointer-events: auto;
      }

      .tool-button.active .pen-size-toggle {
        color: #111;
      }

      .tool-button:not(.active) .pen-size-toggle {
        display: none;
        pointer-events: none;
      }

      .tool-button .icon-stroke {
        fill: none;
        stroke: currentColor;
        stroke-width: 3.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .tool-button .icon-fill {
        fill: currentColor;
      }

      .tool-button.dragging {
        cursor: grabbing;
        opacity: 0.72;
      }

      .group {
        display: flex;
        gap: 6px;
        align-items: center;
        min-height: 42px;
        padding-right: 8px;
        border-right: 1px solid rgba(0, 0, 0, 0.1);
      }

      .group:last-child {
        border-right: 0;
        padding-right: 0;
      }

      button,
      input[type="range"] {
        touch-action: manipulation;
      }

      button {
        height: 42px;
        min-width: 42px;
        border: 1px solid rgba(0, 0, 0, 0.16);
        border-radius: 7px;
        padding: 0 12px;
        color: #111;
        background: #fff;
        font-size: 13px;
        font-weight: 800;
        touch-action: manipulation;
      }

      button.active {
        color: #fff;
        background: #111;
      }

      button:disabled {
        opacity: 0.38;
      }

      #clearButton {
        color: #8a180f;
      }

      .status {
        display: flex;
        gap: 7px;
        align-items: center;
        padding: 0 6px;
        color: #555;
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #c51f1a;
      }

      .dot.connected {
        background: #188038;
      }

      .settings-panel {
        position: fixed;
        z-index: 7;
        width: min(330px, calc(100vw - 24px));
        padding: 12px;
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.12);
        backdrop-filter: blur(14px);
      }

      .settings-panel[hidden] {
        display: none;
      }

      .pen-size-panel {
        position: fixed;
        z-index: 7;
        width: min(250px, calc(100vw - 24px));
        padding: 12px;
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.12);
        backdrop-filter: blur(14px);
      }

      .pen-size-panel[hidden] {
        display: none;
      }

      .settings-row {
        display: grid;
        grid-template-columns: 86px 1fr 46px;
        gap: 10px;
        align-items: center;
        min-height: 34px;
        color: #333;
        font-size: 12px;
        font-weight: 800;
      }

      .settings-row output {
        text-align: right;
        color: #666;
        font-variant-numeric: tabular-nums;
      }

      .settings-title {
        margin-bottom: 6px;
        color: #111;
        font-size: 12px;
        font-weight: 900;
      }

      .color-button {
        position: fixed;
        left: max(12px, env(safe-area-inset-left));
        bottom: max(12px, env(safe-area-inset-bottom));
        z-index: 6;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 46px;
        min-width: 46px;
        padding: 0;
        border-radius: 8px;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.12);
      }

      .color-dot {
        width: 24px;
        height: 24px;
        border: 2px solid rgba(0, 0, 0, 0.22);
        border-radius: 50%;
        background: #111;
      }

      .color-panel {
        position: fixed;
        left: max(12px, env(safe-area-inset-left));
        bottom: calc(max(12px, env(safe-area-inset-bottom)) + 56px);
        z-index: 7;
        display: grid;
        grid-template-columns: repeat(4, 34px);
        gap: 8px;
        padding: 10px;
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.12);
        backdrop-filter: blur(14px);
      }

      .color-panel[hidden] {
        display: none;
      }

      .color-swatch,
      #customColorInput {
        width: 34px;
        height: 34px;
        min-width: 34px;
        padding: 0;
        border-radius: 8px;
      }

      .color-swatch.active {
        box-shadow: 0 0 0 3px #111 inset;
      }

      #customColorInput {
        border: 1px solid rgba(0, 0, 0, 0.16);
        background: #fff;
      }
    </style>
  </head>
  <body>
    <main id="stage">
      <canvas id="ink"></canvas>
    </main>
    <div id="drawAreaOverlay" class="draw-area-overlay" hidden>
      <span class="draw-handle" data-handle="nw"></span>
      <span class="draw-handle" data-handle="ne"></span>
      <span class="draw-handle" data-handle="sw"></span>
      <span class="draw-handle" data-handle="se"></span>
    </div>
    <div id="toolLayer" class="tool-layer">
      <button id="penButton" class="tool-button active" data-tool="pen" type="button" aria-label="Pen" title="Pen">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path class="icon-stroke" d="M10 33 8 40l7-2 23-23-5-5L10 33Z" />
          <path class="icon-stroke" d="M29 14l5 5" />
        </svg>
        <span id="penSizeToggle" class="pen-size-toggle" aria-label="Pen size">&#9662;</span>
      </button>
      <button id="lineButton" class="tool-button" data-tool="line" type="button" aria-label="Line" title="Line">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path class="icon-stroke" d="M9 38 39 10" />
          <path class="icon-fill" d="M7 36h6v6H7zM35 6h6v6h-6z" />
        </svg>
      </button>
      <button id="eraserButton" class="tool-button" data-tool="eraser" type="button" aria-label="Eraser" title="Eraser">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path class="icon-stroke" d="M14 32 29 17c2-2 5-2 7 0l3 3c2 2 2 5 0 7L27 39H14l-5-5 5-2Z" />
          <path class="icon-stroke" d="M24 22l10 10M8 39h31" />
        </svg>
      </button>
      <button id="undoButton" class="tool-button" data-action="undo" type="button" aria-label="Undo" title="Undo">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path class="icon-stroke" d="M19 15 9 24l10 9" />
          <path class="icon-stroke" d="M10 24h18c7 0 11 4 11 10" />
        </svg>
      </button>
      <button id="scrollUpButton" class="tool-button" data-action="scrollUp" type="button" aria-label="Scroll Up" title="Scroll Up">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path class="icon-stroke" d="M24 40V9" />
          <path class="icon-stroke" d="M13 20 24 9l11 11" />
        </svg>
      </button>
      <button id="scrollDownButton" class="tool-button" data-action="scrollDown" type="button" aria-label="Scroll Down" title="Scroll Down">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path class="icon-stroke" d="M24 8v31" />
          <path class="icon-stroke" d="M13 28l11 11 11-11" />
        </svg>
      </button>
    </div>
    <div class="toolbar">
      <div class="group">
        <button id="clearButton" type="button">Clear</button>
      </div>
      <div class="group">
        <button id="snapshotButton" type="button">PC Shot</button>
        <button id="streamButton" type="button">Stream Off</button>
        <button id="hideSnapshotButton" type="button" disabled>Hide PC</button>
        <button id="areaButton" type="button">Area</button>
        <button id="settingsButton" type="button">Settings</button>
      </div>
      <div class="status"><span id="dot" class="dot"></span><span id="status">Offline</span></div>
    </div>
    <section id="settingsPanel" class="settings-panel" hidden>
      <div id="settingsTarget" class="settings-title">Pen selected</div>
      <label class="settings-row">
        Size
        <input id="buttonSizeInput" type="range" min="24" max="76" value="42" />
        <output id="buttonSizeOutput">42</output>
      </label>
      <label class="settings-row">
        Opacity
        <input id="toolbarOpacityInput" type="range" min="35" max="100" value="94" />
        <output id="toolbarOpacityOutput">94%</output>
      </label>
    </section>
    <section id="penSizePanel" class="pen-size-panel" hidden>
      <div class="settings-title">Pen thickness</div>
      <label class="settings-row">
        Width
        <input id="penSizeInput" type="range" min="1" max="36" value="5" />
        <output id="penSizeOutput">5px</output>
      </label>
    </section>
    <button id="colorButton" class="color-button" type="button" aria-label="Pen color" title="Pen color">
      <span id="currentColorDot" class="color-dot"></span>
    </button>
    <section id="colorPanel" class="color-panel" hidden aria-label="Pen colors">
      <button class="color-swatch" type="button" data-color="#111111" style="background: #111111" aria-label="Black"></button>
      <button class="color-swatch" type="button" data-color="#e03131" style="background: #e03131" aria-label="Red"></button>
      <button class="color-swatch" type="button" data-color="#f08c00" style="background: #f08c00" aria-label="Orange"></button>
      <button class="color-swatch" type="button" data-color="#2f9e44" style="background: #2f9e44" aria-label="Green"></button>
      <button class="color-swatch" type="button" data-color="#1971c2" style="background: #1971c2" aria-label="Blue"></button>
      <button class="color-swatch" type="button" data-color="#7048e8" style="background: #7048e8" aria-label="Purple"></button>
      <button class="color-swatch" type="button" data-color="#d6336c" style="background: #d6336c" aria-label="Pink"></button>
      <input id="customColorInput" type="color" value="#111111" aria-label="Custom color" />
    </section>

    <script>
      const canvas = document.querySelector("#ink");
      const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
      const stage = document.querySelector("#stage");
      const drawAreaOverlay = document.querySelector("#drawAreaOverlay");
      const toolbar = document.querySelector(".toolbar");
      const toolLayer = document.querySelector("#toolLayer");
      const settingsPanel = document.querySelector("#settingsPanel");
      const penButton = document.querySelector("#penButton");
      const penSizeToggle = document.querySelector("#penSizeToggle");
      const penSizePanel = document.querySelector("#penSizePanel");
      const penSizeInput = document.querySelector("#penSizeInput");
      const penSizeOutput = document.querySelector("#penSizeOutput");
      const lineButton = document.querySelector("#lineButton");
      const eraserButton = document.querySelector("#eraserButton");
      const undoButton = document.querySelector("#undoButton");
      const scrollUpButton = document.querySelector("#scrollUpButton");
      const scrollDownButton = document.querySelector("#scrollDownButton");
      const toolButtons = [penButton, lineButton, eraserButton];
      const passthroughButtons = [penButton, lineButton, eraserButton, undoButton];
      const floatingButtons = [penButton, lineButton, eraserButton, undoButton, scrollUpButton, scrollDownButton];
      const clearButton = document.querySelector("#clearButton");
      const snapshotButton = document.querySelector("#snapshotButton");
      const streamButton = document.querySelector("#streamButton");
      const hideSnapshotButton = document.querySelector("#hideSnapshotButton");
      const areaButton = document.querySelector("#areaButton");
      const settingsButton = document.querySelector("#settingsButton");
      const settingsTarget = document.querySelector("#settingsTarget");
      const buttonSizeInput = document.querySelector("#buttonSizeInput");
      const toolbarOpacityInput = document.querySelector("#toolbarOpacityInput");
      const buttonSizeOutput = document.querySelector("#buttonSizeOutput");
      const toolbarOpacityOutput = document.querySelector("#toolbarOpacityOutput");
      const colorButton = document.querySelector("#colorButton");
      const colorPanel = document.querySelector("#colorPanel");
      const currentColorDot = document.querySelector("#currentColorDot");
      const customColorInput = document.querySelector("#customColorInput");
      const colorSwatches = Array.from(document.querySelectorAll(".color-swatch"));
      const dot = document.querySelector("#dot");
      const statusEl = document.querySelector("#status");

      const params = new URLSearchParams(location.search);
      const token = params.get("token") || "";
      const buildId = "whiteboard-floating-tools-20260429-2";
      const settingsKey = "whiteboard.floatingToolSettings.v1";
      const colorKey = "whiteboard.penColor.v1";
      const penSizeKey = "whiteboard.penSize.v1";
      const drawAreaKey = "whiteboard.drawArea.v1";
      const defaultSettings = {
        tools: {
          pen: { x: 0, y: 16, size: 42, opacity: 94 },
          line: { x: 0, y: 30, size: 42, opacity: 94 },
          eraser: { x: 0, y: 44, size: 42, opacity: 94 },
          undo: { x: 0, y: 58, size: 42, opacity: 94 },
          scrollUp: { x: 0, y: 72, size: 42, opacity: 94 },
          scrollDown: { x: 0, y: 86, size: 42, opacity: 94 },
        },
      };

      const state = {
        monitor: { width: 16, height: 10 },
        tool: "pen",
        selectedControl: "pen",
        color: localStorage.getItem(colorKey) || "#111111",
        size: clamp(savedNumber(localStorage.getItem(penSizeKey), 5), 1, 36),
        snapshot: null,
        screenFrame: null,
        screenStreamEnabled: false,
        snapshotVisible: false,
        drawAreaEdit: false,
        drawArea: loadDrawArea(),
        view: {
          zoom: 1,
          center: { x: 0.5, y: 0.5 },
          rect: { left: 0, top: 0, width: 1, height: 1 },
        },
        dpr: window.devicePixelRatio || 1,
        strokes: [],
        undone: [],
        floatingSettings: loadFloatingSettings(),
      };

      function setStatus(text, connected = false) {
        statusEl.textContent = text;
        statusEl.title = buildId;
        dot.classList.toggle("connected", connected);
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function savedNumber(value, fallback) {
        const number = Number(value);
        return Number.isFinite(number) ? number : fallback;
      }

      function loadDrawArea() {
        try {
          const saved = JSON.parse(localStorage.getItem(drawAreaKey) || "{}");
          const area = {
            x: clamp(savedNumber(saved.x, 0.05), 0, 0.95),
            y: clamp(savedNumber(saved.y, 0.05), 0, 0.95),
            width: clamp(savedNumber(saved.width, 0.9), 0.05, 1),
            height: clamp(savedNumber(saved.height, 0.9), 0.05, 1),
          };
          area.width = Math.min(area.width, 1 - area.x);
          area.height = Math.min(area.height, 1 - area.y);
          return area;
        } catch (_) {
          return { x: 0.05, y: 0.05, width: 0.9, height: 0.9 };
        }
      }

      function saveDrawArea() {
        localStorage.setItem(drawAreaKey, JSON.stringify(state.drawArea));
      }

      function loadFloatingSettings() {
        try {
          const saved = JSON.parse(localStorage.getItem(settingsKey) || "{}");
          const tools = JSON.parse(JSON.stringify(defaultSettings.tools));
          for (const tool of Object.keys(tools)) {
            const savedTool = saved.tools && saved.tools[tool] ? saved.tools[tool] : {};
            tools[tool] = {
              x: clamp(savedNumber(savedTool.x, tools[tool].x), 0, 100),
              y: clamp(savedNumber(savedTool.y, tools[tool].y), 0, 100),
              size: clamp(savedNumber(savedTool.size, savedNumber(saved.buttonSize, tools[tool].size)), 24, 76),
              opacity: clamp(savedNumber(savedTool.opacity, savedNumber(saved.opacity, tools[tool].opacity)), 35, 100),
            };
          }
          return {
            tools,
          };
        } catch (_) {
          return JSON.parse(JSON.stringify(defaultSettings));
        }
      }

      function saveFloatingSettings() {
        localStorage.setItem(settingsKey, JSON.stringify(state.floatingSettings));
      }

      function wsUrl() {
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        const url = new URL(`${protocol}//${location.host}/pointer`);
        url.searchParams.set("token", token);
        return url.toString();
      }

      function screenWsUrl() {
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        const url = new URL(`${protocol}//${location.host}/screen`);
        url.searchParams.set("token", token);
        url.searchParams.set("fps", "12");
        url.searchParams.set("quality", "58");
        return url.toString();
      }

      function snapshotUrl() {
        const url = new URL(`${location.protocol}//${location.host}/snapshot`);
        url.searchParams.set("token", token);
        url.searchParams.set("quality", "72");
        url.searchParams.set("v", String(Date.now()));
        return url.toString();
      }

      class PointerTransport {
        constructor() {
          this.ws = null;
          this.reconnectTimer = null;
          this.moveQueue = [];
          this.flushTimer = null;
          this.lastQueuedMove = null;
          this.sequence = 0;
        }

        connect() {
          if (this.ws) {
            this.ws.close();
          }
          setStatus("Connecting", false);
          let opened = false;
          this.ws = new WebSocket(wsUrl());
          this.ws.addEventListener("open", () => {
            opened = true;
            setStatus("Online", true);
          });
          this.ws.addEventListener("message", (event) => {
            const message = JSON.parse(event.data);
            if (message.type === "ready" && message.monitor) {
              state.monitor = message.monitor;
              resizeStage();
              applyFloatingSettings();
            }
          });
          this.ws.addEventListener("close", () => {
            setStatus(opened ? "Offline" : "Check URL", false);
            this.scheduleReconnect();
          });
          this.ws.addEventListener("error", () => setStatus(opened ? "Error" : "Check URL", false));
        }

        scheduleReconnect() {
          if (this.reconnectTimer) {
            return;
          }
          this.reconnectTimer = setTimeout(() => {
            this.reconnectTimer = null;
            this.connect();
          }, 700);
        }

        isOpen() {
          return this.ws && this.ws.readyState === WebSocket.OPEN;
        }

        send(message) {
          if (!this.isOpen()) {
            return;
          }
          this.ws.send(JSON.stringify(message));
        }

        eventMessage(action, point, sourceEvent, options = {}) {
          return {
            type: "pointer",
            action,
            x: point.x,
            y: point.y,
            pressure: sourceEvent.pressure || 0,
            pointerType: sourceEvent.pointerType || "touch",
            pointerId: sourceEvent.pointerId,
            seq: ++this.sequence,
            t: Math.round(performance.now()),
            ...options,
          };
        }

        sendPriority(action, point, sourceEvent, options = {}) {
          this.flushMoves();
          this.send(this.eventMessage(action, point, sourceEvent, options));
        }

        sendWheel(point, sourceEvent, wheelDelta) {
          this.flushMoves();
          this.send(this.eventMessage("wheel", point, sourceEvent, { wheelDelta }));
        }

        sendMoveNow(point, sourceEvent, options = {}) {
          this.flushMoves();
          this.send(this.eventMessage("move", point, sourceEvent, options));
          this.lastQueuedMove = point;
        }

        queueMove(point, sourceEvent, options = {}) {
          if (!this.isOpen()) {
            return;
          }
          if (this.ws.bufferedAmount > 32768) {
            this.moveQueue.length = 0;
            this.lastQueuedMove = null;
            return;
          }
          if (
            this.lastQueuedMove &&
            Math.abs(this.lastQueuedMove.x - point.x) < 0.00018 &&
            Math.abs(this.lastQueuedMove.y - point.y) < 0.00018
          ) {
            return;
          }
          this.lastQueuedMove = point;
          this.moveQueue.push(this.eventMessage("move", point, sourceEvent, options));
          if (this.moveQueue.length >= 16) {
            this.flushMoves();
            return;
          }
          if (!this.flushTimer) {
            this.flushTimer = setTimeout(() => this.flushMoves(), 8);
          }
        }

        flushMoves() {
          if (this.flushTimer) {
            clearTimeout(this.flushTimer);
            this.flushTimer = null;
          }
          if (!this.moveQueue.length) {
            return;
          }
          const events = this.moveQueue.splice(0, 64);
          this.send({ type: "pointer_batch", events });
        }

        resetStrokeState() {
          this.lastQueuedMove = null;
        }
      }

      class StrokeEngine {
        constructor(transport) {
          this.transport = transport;
          this.active = null;
          this.lastLocalMove = null;
        }

        paceOptions() {
          return this.active && !this.active.remoteOnly ? { pace: "precise" } : {};
        }

        start(event) {
          event.preventDefault();
          if (!isInsideBoard(event)) {
            return;
          }
          if (this.active) {
            this.forceFinish(event);
          }

          const localPoint = pointerRatio(event);
          const ratio = localPoint;
          this.active = {
            pointerId: event.pointerId,
            stroke: isInsideDrawArea(localPoint) ? createStroke(localPoint) : null,
            remoteOnly: !isInsideDrawArea(localPoint),
            lastPoint: localPoint,
            lastRatio: ratio,
            pathLength: 0,
            moveCount: 0,
          };
          state.undone = [];
          try {
            canvas.setPointerCapture(event.pointerId);
          } catch (_) {}

          if (this.active.remoteOnly) {
            this.transport.sendPriority("down", ratio, event);
            return;
          }

          if (this.active.stroke.tool !== "line") {
            if (this.active.stroke.tool === "eraser") {
              redraw(this.active.stroke);
            } else {
              drawDot(localPoint, this.active.stroke);
            }
          }
          this.transport.sendPriority("down", ratio, event, this.paceOptions());
          updateHistoryButtons();
        }

        move(event) {
          event.preventDefault();
          if (!this.active || event.pointerId !== this.active.pointerId) {
            return;
          }
          const events = event.getCoalescedEvents ? event.getCoalescedEvents() : [event];
          for (const item of events) {
            this.applyMove(item);
          }
        }

        applyMove(event) {
          if (!this.shouldUseLocalMove(event)) {
            return;
          }
          const point = pointerRatio(event);
          const ratio = pointerRatio(event);
          if (this.active.remoteOnly) {
            this.active.lastRatio = ratio;
            this.active.moveCount += 1;
            this.transport.queueMove(ratio, event);
            return;
          }
          const stroke = this.active.stroke;
          if (stroke.tool === "line") {
            stroke.points[1] = point;
            redraw(stroke);
          } else if (viewDistance(this.active.lastPoint, point) >= 0.35) {
            this.active.pathLength += viewDistance(this.active.lastPoint, point);
            stroke.points.push(point);
            if (stroke.tool === "eraser") {
              redraw(stroke);
            } else {
              drawSegment(this.active.lastPoint, point, stroke);
            }
            this.active.lastPoint = point;
          }
          this.active.lastRatio = ratio;
          this.active.moveCount += 1;
          this.transport.queueMove(ratio, event, this.paceOptions());
        }

        finish(event) {
          event.preventDefault();
          if (!this.active || event.pointerId !== this.active.pointerId) {
            return;
          }
          const point = pointerRatio(event);
          const ratio = pointerRatio(event);
          if (this.active.remoteOnly) {
            this.active.lastRatio = ratio;
            this.transport.sendPriority("up", ratio, event);
            this.releaseActive();
            return;
          }
          const stroke = this.active.stroke;
          if (stroke.tool === "line") {
            stroke.points[1] = point;
            this.active.pathLength = viewDistance(stroke.points[0], point);
            redraw(stroke);
            this.active.lastRatio = ratio;
            this.transport.sendMoveNow(ratio, event, this.paceOptions());
          } else {
            const tailDistance = viewDistance(this.active.lastPoint, point);
            if (tailDistance > 0.35) {
              this.active.pathLength += tailDistance;
              stroke.points.push(point);
              if (stroke.tool === "eraser") {
                redraw(stroke);
              } else {
                drawSegment(this.active.lastPoint, point, stroke);
              }
              this.active.lastPoint = point;
              this.active.lastRatio = ratio;
            }
            this.normalizeShortStroke(event, point);
          }

          state.strokes.push(cloneStroke(this.active.stroke));
          this.transport.sendPriority("up", this.active.lastRatio, event, this.paceOptions());
          this.releaseActive();
          updateHistoryButtons();
        }

        normalizeShortStroke(event, finalPoint) {
          const stroke = this.active.stroke;
          const minimumPixels = Math.max(state.size * state.dpr * 1.4, 8 * state.dpr);
          const strokeDistance = Math.max(this.active.pathLength, viewDistance(stroke.points[0], finalPoint));
          if (strokeDistance >= minimumPixels || this.active.moveCount >= 2) {
            return;
          }

          const start = stroke.points[0];
          const startView = viewPointFromRatio(start);
          const finalView = viewPointFromRatio(finalPoint);
          let dx = finalView.x - startView.x;
          let dy = finalView.y - startView.y;
          const length = Math.hypot(dx, dy);
          if (length < 0.01) {
            dx = minimumPixels;
            dy = 0;
          } else {
            const scale = minimumPixels / Math.max(length, 0.01);
            dx *= scale;
            dy *= scale;
          }
          const endPoint = ratioFromCanvasPoint({
            x: startView.x + dx,
            y: startView.y + dy,
          });
          stroke.points.push(endPoint);
          if (stroke.tool === "eraser") {
            redraw(stroke);
          } else {
            drawSegment(start, endPoint, stroke);
          }
          this.active.lastPoint = endPoint;
          this.active.lastRatio = endPoint;
          this.transport.sendMoveNow(endPoint, event, this.paceOptions());
        }

        forceFinish(event) {
          if (!this.active) {
            return;
          }
          this.transport.sendPriority("up", this.active.lastRatio, {
            pointerId: this.active.pointerId,
            pointerType: event.pointerType || "touch",
            pressure: 0,
          });
          this.releaseActive();
        }

        releaseActive() {
          if (!this.active) {
            return;
          }
          try {
            canvas.releasePointerCapture(this.active.pointerId);
          } catch (_) {}
          this.active = null;
          this.lastLocalMove = null;
          this.transport.resetStrokeState();
          redraw();
        }

        shouldUseLocalMove(event) {
          const now = performance.now();
          if (
            this.lastLocalMove &&
            this.lastLocalMove.pointerId === event.pointerId &&
            this.lastLocalMove.x === event.clientX &&
            this.lastLocalMove.y === event.clientY &&
            now - this.lastLocalMove.time < 4
          ) {
            return false;
          }
          this.lastLocalMove = {
            pointerId: event.pointerId,
            x: event.clientX,
            y: event.clientY,
            time: now,
          };
          return true;
        }
      }

      const transport = new PointerTransport();
      const engine = new StrokeEngine(transport);
      const strokeCanvas = document.createElement("canvas");
      const strokeCtx = strokeCanvas.getContext("2d");
      const touchPoints = new Map();
      let pinchState = null;
      let pendingTouchStart = null;
      let screenWs = null;

      function resizeStage() {
        state.dpr = window.devicePixelRatio || 1;
        const aspect = Math.max(0.01, state.monitor.width / Math.max(1, state.monitor.height));
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;
        let width = viewportWidth;
        let height = width / aspect;
        if (height > viewportHeight) {
          height = viewportHeight;
          width = height * aspect;
        }
        document.documentElement.style.setProperty("--stage-left", `${(viewportWidth - width) / 2}px`);
        document.documentElement.style.setProperty("--stage-top", `${(viewportHeight - height) / 2}px`);
        document.documentElement.style.setProperty("--stage-width", `${width}px`);
        document.documentElement.style.setProperty("--stage-height", `${height}px`);

        const pixelWidth = Math.max(1, Math.floor(width * state.dpr));
        const pixelHeight = Math.max(1, Math.floor(height * state.dpr));
        if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
          canvas.width = pixelWidth;
          canvas.height = pixelHeight;
          strokeCanvas.width = pixelWidth;
          strokeCanvas.height = pixelHeight;
        }
        computeViewRect();
        redraw();
        updateDrawAreaOverlay();
      }

      function clampImageOffset(offset, viewSize, imageSize) {
        if (imageSize <= viewSize) {
          return (viewSize - imageSize) / 2;
        }
        return clamp(offset, viewSize - imageSize, 0);
      }

      function computeViewRect() {
        const zoom = state.view.zoom;
        const width = canvas.width * zoom;
        const height = canvas.height * zoom;
        const left = zoom <= 1
          ? (canvas.width - width) / 2
          : clampImageOffset(canvas.width / 2 - state.view.center.x * width, canvas.width, width);
        const top = zoom <= 1
          ? (canvas.height - height) / 2
          : clampImageOffset(canvas.height / 2 - state.view.center.y * height, canvas.height, height);
        state.view.rect = { left, top, width, height };
      }

      function setZoomAround(nextZoom, focusRatio, focusClientPoint) {
        const previousZoom = state.view.zoom;
        const zoom = Math.round(clamp(nextZoom, 1, 4) * 100) / 100;
        if (zoom === previousZoom && zoom === 1) {
          return;
        }
        state.view.zoom = zoom;
        if (zoom <= 1) {
          state.view.center = { x: 0.5, y: 0.5 };
        } else {
          const focusCanvasPoint = clientToCanvasPoint(focusClientPoint.x, focusClientPoint.y);
          const width = canvas.width * zoom;
          const height = canvas.height * zoom;
          state.view.center = {
            x: clamp(focusRatio.x + (canvas.width / 2 - focusCanvasPoint.x) / width, 0, 1),
            y: clamp(focusRatio.y + (canvas.height / 2 - focusCanvasPoint.y) / height, 0, 1),
          };
        }
        computeViewRect();
        redraw();
        updateDrawAreaOverlay();
      }

      function twoTouchPoints() {
        return Array.from(touchPoints.values()).slice(0, 2);
      }

      function midpoint(points) {
        return {
          x: (points[0].clientX + points[1].clientX) / 2,
          y: (points[0].clientY + points[1].clientY) / 2,
        };
      }

      function touchDistance(points) {
        return Math.hypot(points[0].clientX - points[1].clientX, points[0].clientY - points[1].clientY);
      }

      function beginPinchZoom(event) {
        const points = twoTouchPoints();
        if (points.length < 2) {
          return;
        }
        clearPendingTouchStart();
        engine.forceFinish(event);
        const center = midpoint(points);
        pinchState = {
          startDistance: Math.max(1, touchDistance(points)),
          startZoom: state.view.zoom,
          focusRatio: pointerRatioFromClient(center.x, center.y),
        };
      }

      function eventSnapshot(event) {
        return {
          pointerId: event.pointerId,
          pointerType: event.pointerType || "touch",
          clientX: event.clientX,
          clientY: event.clientY,
          pressure: event.pressure || 0,
          preventDefault() {},
        };
      }

      function clearPendingTouchStart() {
        if (!pendingTouchStart) {
          return;
        }
        clearTimeout(pendingTouchStart.timer);
        pendingTouchStart = null;
      }

      function startPendingTouchStroke() {
        if (!pendingTouchStart || pinchState || touchPoints.size !== 1) {
          clearPendingTouchStart();
          return false;
        }
        const event = pendingTouchStart.event;
        clearPendingTouchStart();
        engine.start(event);
        return true;
      }

      function updatePinchZoom() {
        if (!pinchState || touchPoints.size < 2) {
          return;
        }
        const points = twoTouchPoints();
        const center = midpoint(points);
        const scale = touchDistance(points) / pinchState.startDistance;
        setZoomAround(pinchState.startZoom * scale, pinchState.focusRatio, center);
      }

      function handleCanvasPointerDown(event) {
        event.preventDefault();
        if (event.pointerType === "touch") {
          touchPoints.set(event.pointerId, { clientX: event.clientX, clientY: event.clientY });
          try {
            canvas.setPointerCapture(event.pointerId);
          } catch (_) {}
          if (touchPoints.size === 2) {
            beginPinchZoom(event);
            return;
          }
          if (touchPoints.size > 1) {
            return;
          }
          clearPendingTouchStart();
          pendingTouchStart = {
            pointerId: event.pointerId,
            startX: event.clientX,
            startY: event.clientY,
            event: eventSnapshot(event),
            timer: setTimeout(startPendingTouchStroke, 90),
          };
          return;
        }
        engine.start(event);
      }

      function handleCanvasPointerMove(event) {
        event.preventDefault();
        if (event.pointerType === "touch") {
          if (touchPoints.has(event.pointerId)) {
            touchPoints.set(event.pointerId, { clientX: event.clientX, clientY: event.clientY });
          }
          if (pinchState) {
            updatePinchZoom();
            return;
          }
          if (touchPoints.size > 1) {
            return;
          }
          if (pendingTouchStart && pendingTouchStart.pointerId === event.pointerId) {
            pendingTouchStart.event = eventSnapshot(event);
            const moved = Math.hypot(event.clientX - pendingTouchStart.startX, event.clientY - pendingTouchStart.startY);
            if (moved >= 6 && startPendingTouchStroke()) {
              engine.move(event);
            }
            return;
          }
        }
        engine.move(event);
      }

      function handleCanvasPointerEnd(event) {
        event.preventDefault();
        if (event.pointerType === "touch") {
          const wasPinching = Boolean(pinchState);
          touchPoints.delete(event.pointerId);
          if (pendingTouchStart && pendingTouchStart.pointerId === event.pointerId) {
            const pendingEvent = pendingTouchStart.event;
            clearPendingTouchStart();
            if (!wasPinching) {
              engine.start(pendingEvent);
              engine.finish(eventSnapshot(event));
            }
            return;
          }
          if (touchPoints.size < 2) {
            pinchState = null;
          }
          if (wasPinching) {
            return;
          }
        }
        engine.finish(event);
      }

      function createStroke(point) {
        const tool = state.tool;
        return {
          tool,
          color: tool === "eraser" ? "#000000" : state.color,
          size: tool === "eraser" ? 18 : state.size,
          alpha: 1,
          points: tool === "line" ? [point, point] : [point],
        };
      }

      function cloneStroke(stroke) {
        return {
          tool: stroke.tool,
          color: stroke.color,
          size: stroke.size,
          alpha: stroke.alpha,
          points: stroke.points.map((point) => ({ x: point.x, y: point.y })),
        };
      }

      function redraw(previewStroke = null) {
        drawPaper();
        drawSnapshot();
        drawStrokeLayer(previewStroke || activePreviewStroke());
      }

      function activePreviewStroke() {
        if (!engine.active || engine.active.remoteOnly) {
          return null;
        }
        return engine.active.stroke;
      }

      function drawStrokeLayer(previewStroke = null) {
        strokeCtx.clearRect(0, 0, strokeCanvas.width, strokeCanvas.height);
        for (const stroke of state.strokes) {
          drawStroke(stroke, strokeCtx);
        }
        if (previewStroke) {
          drawStroke(previewStroke, strokeCtx);
        }
        ctx.save();
        ctx.globalCompositeOperation = "source-over";
        ctx.drawImage(strokeCanvas, 0, 0);
        ctx.restore();
      }

      function drawPaper() {
        ctx.save();
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
      }

      function drawSnapshot() {
        const frame = state.screenStreamEnabled && state.screenFrame ? state.screenFrame : state.snapshot;
        if (!state.snapshotVisible || !frame) {
          return;
        }
        ctx.save();
        ctx.globalAlpha = 0.82;
        const rect = state.view.rect;
        ctx.drawImage(frame, rect.left, rect.top, rect.width, rect.height);
        ctx.restore();
      }

      function drawStroke(stroke, targetCtx = ctx) {
        if (!stroke.points.length) {
          return;
        }
        if (stroke.points.length === 1) {
          drawDot(stroke.points[0], stroke, targetCtx);
          return;
        }
        for (let i = 1; i < stroke.points.length; i += 1) {
          drawSegment(stroke.points[i - 1], stroke.points[i], stroke, targetCtx);
        }
      }

      function drawSegment(from, to, stroke, targetCtx = ctx) {
        const fromView = viewPointFromRatio(from);
        const toView = viewPointFromRatio(to);
        targetCtx.save();
        targetCtx.lineCap = "round";
        targetCtx.lineJoin = "round";
        targetCtx.globalAlpha = stroke.alpha;
        targetCtx.globalCompositeOperation = stroke.tool === "eraser" ? "destination-out" : "source-over";
        targetCtx.strokeStyle = stroke.color;
        targetCtx.lineWidth = Math.max(1, stroke.size * state.dpr * state.view.zoom);
        targetCtx.beginPath();
        targetCtx.moveTo(fromView.x, fromView.y);
        targetCtx.lineTo(toView.x, toView.y);
        targetCtx.stroke();
        targetCtx.restore();
      }

      function drawDot(point, stroke, targetCtx = ctx) {
        const viewPoint = viewPointFromRatio(point);
        targetCtx.save();
        targetCtx.globalAlpha = stroke.alpha;
        targetCtx.globalCompositeOperation = stroke.tool === "eraser" ? "destination-out" : "source-over";
        targetCtx.fillStyle = stroke.color;
        const radius = Math.max(1, stroke.size * state.dpr * state.view.zoom) / 2;
        targetCtx.beginPath();
        targetCtx.arc(viewPoint.x, viewPoint.y, radius, 0, Math.PI * 2);
        targetCtx.fill();
        targetCtx.restore();
      }

      function setTool(tool) {
        state.tool = tool;
        state.selectedControl = tool;
        for (const [button, value] of [
          [penButton, "pen"],
          [lineButton, "line"],
          [eraserButton, "eraser"],
        ]) {
          button.classList.toggle("active", tool === value);
        }
        applyFloatingSettings();
      }

      function undo() {
        const stroke = state.strokes.pop();
        if (!stroke) {
          return;
        }
        state.undone.push(stroke);
        redraw();
        updateHistoryButtons();
      }

      async function clearAll() {
        if (state.strokes.length) {
          state.undone.push(...state.strokes.splice(0));
          redraw();
          updateHistoryButtons();
        }
        await loadSnapshot();
      }

      function updateHistoryButtons() {
        hideSnapshotButton.disabled = !state.snapshot && !state.screenFrame;
        hideSnapshotButton.textContent = state.snapshotVisible ? "Hide PC" : "Show PC";
      }

      async function loadSnapshot() {
        snapshotButton.disabled = true;
        const previousLabel = snapshotButton.textContent;
        snapshotButton.textContent = "Loading";
        try {
          const response = await fetch(snapshotUrl(), { cache: "no-store" });
          if (!response.ok) {
            throw new Error(`snapshot ${response.status}`);
          }
          const blob = await response.blob();
          const image = await createImageBitmap(blob);
          if (state.snapshot && state.snapshot.close) {
            state.snapshot.close();
          }
          state.snapshot = image;
          state.snapshotVisible = true;
          redraw();
          updateHistoryButtons();
        } catch (error) {
          setStatus("Snapshot failed", false);
        } finally {
          snapshotButton.disabled = false;
          snapshotButton.textContent = previousLabel;
        }
      }

      function connectScreenStream() {
        disconnectScreenStream();
        screenWs = new WebSocket(screenWsUrl());
        screenWs.binaryType = "blob";
        screenWs.addEventListener("message", async (event) => {
          if (typeof event.data === "string") {
            const message = JSON.parse(event.data);
            if (message.type === "screen_meta" && message.monitor) {
              state.monitor = message.monitor;
              resizeStage();
              applyFloatingSettings();
            }
            return;
          }
          try {
            const image = await createImageBitmap(event.data);
            if (state.screenFrame && state.screenFrame.close) {
              state.screenFrame.close();
            }
            state.screenFrame = image;
            state.snapshotVisible = true;
            redraw();
            updateHistoryButtons();
          } catch (_) {}
        });
        screenWs.addEventListener("close", () => {
          if (state.screenStreamEnabled) {
            setTimeout(connectScreenStream, 800);
          }
        });
      }

      function disconnectScreenStream() {
        if (screenWs) {
          const ws = screenWs;
          screenWs = null;
          ws.close();
        }
      }

      function toggleScreenStream() {
        state.screenStreamEnabled = !state.screenStreamEnabled;
        streamButton.textContent = state.screenStreamEnabled ? "Stream On" : "Stream Off";
        streamButton.classList.toggle("active", state.screenStreamEnabled);
        state.snapshotVisible = true;
        if (state.screenStreamEnabled) {
          connectScreenStream();
        } else {
          disconnectScreenStream();
          redraw();
          updateHistoryButtons();
        }
      }

      function toggleSnapshot() {
        if (!state.snapshot) {
          return;
        }
        state.snapshotVisible = !state.snapshotVisible;
        redraw();
        updateHistoryButtons();
      }

      function isInsideBoard(event) {
        const rect = canvas.getBoundingClientRect();
        return event.clientX >= rect.left && event.clientX <= rect.right && event.clientY >= rect.top && event.clientY <= rect.bottom;
      }

      function clientToCanvasPoint(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: clamp((clientX - rect.left) * state.dpr, 0, canvas.width),
          y: clamp((clientY - rect.top) * state.dpr, 0, canvas.height),
        };
      }

      function pointerRatio(event) {
        return pointerRatioFromClient(event.clientX, event.clientY);
      }

      function ratioFromCanvasPoint(point) {
        const rect = state.view.rect;
        return {
          x: clamp((point.x - rect.left) / Math.max(1, rect.width), 0, 1),
          y: clamp((point.y - rect.top) / Math.max(1, rect.height), 0, 1),
        };
      }

      function pointerRatioFromClient(clientX, clientY) {
        return ratioFromCanvasPoint(clientToCanvasPoint(clientX, clientY));
      }

      function viewPointFromRatio(point) {
        const rect = state.view.rect;
        return {
          x: rect.left + point.x * rect.width,
          y: rect.top + point.y * rect.height,
        };
      }

      function viewDistance(left, right) {
        return distance(viewPointFromRatio(left), viewPointFromRatio(right));
      }

      function isInsideDrawArea(point) {
        const area = state.drawArea;
        return (
          point.x >= area.x &&
          point.x <= area.x + area.width &&
          point.y >= area.y &&
          point.y <= area.y + area.height
        );
      }

      function drawAreaClientRect() {
        const canvasRect = canvas.getBoundingClientRect();
        const view = state.view.rect;
        const area = state.drawArea;
        return {
          left: canvasRect.left + (view.left + area.x * view.width) / state.dpr,
          top: canvasRect.top + (view.top + area.y * view.height) / state.dpr,
          width: (area.width * view.width) / state.dpr,
          height: (area.height * view.height) / state.dpr,
        };
      }

      function updateDrawAreaOverlay() {
        if (drawAreaOverlay.hidden) {
          return;
        }
        const rect = drawAreaClientRect();
        drawAreaOverlay.style.left = `${rect.left}px`;
        drawAreaOverlay.style.top = `${rect.top}px`;
        drawAreaOverlay.style.width = `${rect.width}px`;
        drawAreaOverlay.style.height = `${rect.height}px`;
        drawAreaOverlay.classList.toggle("editing", state.drawAreaEdit);
      }

      function setDrawAreaEdit(enabled) {
        state.drawAreaEdit = enabled;
        drawAreaOverlay.hidden = !enabled;
        areaButton.classList.toggle("active", enabled);
        updateDrawAreaOverlay();
      }

      function sendRemoteClickAt(clientX, clientY, sourceEvent) {
        const ratio = pointerRatioFromClient(clientX, clientY);
        const source = {
          pointerId: sourceEvent.pointerId,
          pointerType: sourceEvent.pointerType || "touch",
          pressure: sourceEvent.pressure || 0.5,
        };
        transport.sendPriority("down", ratio, source);
        transport.sendPriority("up", ratio, source);
      }

      function sendRemoteWheelStepAt(clientX, clientY, sourceEvent, wheelDelta) {
        const ratio = pointerRatioFromClient(clientX, clientY);
        const source = {
          pointerId: sourceEvent.pointerId,
          pointerType: sourceEvent.pointerType || "touch",
          pressure: 0,
        };
        transport.sendWheel(ratio, source, wheelDelta);
      }

      function isScrollAction(action) {
        return action === "scrollUp" || action === "scrollDown";
      }

      function applyFloatingSettings() {
        const selected = selectedControlSettings();

        settingsTarget.textContent = `${controlLabel(state.selectedControl)} selected`;
        buttonSizeInput.value = String(selected.size);
        toolbarOpacityInput.value = String(selected.opacity);
        buttonSizeOutput.textContent = String(selected.size);
        toolbarOpacityOutput.textContent = `${selected.opacity}%`;

        requestAnimationFrame(() => {
          for (const button of floatingButtons) {
            applyToolButtonStyle(button);
            placeToolButton(button);
          }
          updateDrawAreaOverlay();
          positionSettingsPanel();
          positionPenSizePanel();
        });
      }

      function selectedControlSettings() {
        return state.floatingSettings.tools[state.selectedControl] || defaultSettings.tools[state.selectedControl];
      }

      function controlLabel(control) {
        if (control === "pen") return "Pen";
        if (control === "line") return "Line";
        if (control === "eraser") return "Eraser";
        if (control === "scrollUp") return "Scroll Up";
        if (control === "scrollDown") return "Scroll Down";
        return "Undo";
      }

      function applyToolButtonStyle(button) {
        const key = floatingButtonKey(button);
        const settings = state.floatingSettings.tools[key] || defaultSettings.tools[key];
        const size = settings.size;
        button.style.height = `${size}px`;
        button.style.width = `${size}px`;
        button.style.minWidth = `${size}px`;
        button.style.fontSize = `${clamp(size * 0.31, 12, 17)}px`;
        button.style.opacity = String(settings.opacity / 100);
      }

      function placeToolButton(button) {
        const key = floatingButtonKey(button);
        const position = state.floatingSettings.tools[key] || defaultSettings.tools[key];
        const safe = 8;
        const rect = stage.getBoundingClientRect();
        const minLeft = rect.left + safe;
        const minTop = rect.top + safe;
        const maxLeft = Math.max(minLeft, rect.right - button.offsetWidth - safe);
        const maxTop = Math.max(minTop, rect.bottom - button.offsetHeight - safe);
        const left = minLeft + ((maxLeft - minLeft) * position.x) / 100;
        const top = minTop + ((maxTop - minTop) * position.y) / 100;
        button.style.left = `${left}px`;
        button.style.top = `${top}px`;
      }

      function updateToolPositionFromClient(button, clientX, clientY) {
        const key = floatingButtonKey(button);
        const settings = state.floatingSettings.tools[key] || defaultSettings.tools[key];
        const safe = 8;
        const rect = stage.getBoundingClientRect();
        const minLeft = rect.left + safe;
        const minTop = rect.top + safe;
        const maxLeft = Math.max(minLeft, rect.right - button.offsetWidth - safe);
        const maxTop = Math.max(minTop, rect.bottom - button.offsetHeight - safe);
        const left = clamp(clientX - button.offsetWidth / 2, minLeft, maxLeft);
        const top = clamp(clientY - button.offsetHeight / 2, minTop, maxTop);
        button.style.left = `${left}px`;
        button.style.top = `${top}px`;
        state.floatingSettings.tools[key] = {
          ...settings,
          x: maxLeft === minLeft ? 0 : ((left - minLeft) / (maxLeft - minLeft)) * 100,
          y: maxTop === minTop ? 0 : ((top - minTop) / (maxTop - minTop)) * 100,
        };
      }

      function floatingButtonKey(button) {
        return button.dataset.tool || button.dataset.action;
      }

      function positionSettingsPanel() {
        if (settingsPanel.hidden) {
          return;
        }
        const safe = 12;
        const toolbarRect = toolbar.getBoundingClientRect();
        const left = clamp(toolbarRect.left, safe, Math.max(safe, window.innerWidth - settingsPanel.offsetWidth - safe));
        const belowTop = toolbarRect.bottom + 8;
        const top = belowTop + settingsPanel.offsetHeight <= window.innerHeight - safe
          ? belowTop
          : Math.max(safe, toolbarRect.top - settingsPanel.offsetHeight - 8);
        settingsPanel.style.left = `${left}px`;
        settingsPanel.style.top = `${top}px`;
      }

      function positionPenSizePanel() {
        if (penSizePanel.hidden) {
          return;
        }
        const safe = 12;
        const penRect = penButton.getBoundingClientRect();
        const left = clamp(penRect.left, safe, Math.max(safe, window.innerWidth - penSizePanel.offsetWidth - safe));
        const belowTop = penRect.bottom + 8;
        const top = belowTop + penSizePanel.offsetHeight <= window.innerHeight - safe
          ? belowTop
          : Math.max(safe, penRect.top - penSizePanel.offsetHeight - 8);
        penSizePanel.style.left = `${left}px`;
        penSizePanel.style.top = `${top}px`;
      }

      function updateFloatingSetting(key, value) {
        const control = state.selectedControl;
        state.floatingSettings.tools[control] = {
          ...state.floatingSettings.tools[control],
          [key]: Number(value),
        };
        saveFloatingSettings();
        applyFloatingSettings();
      }

      function setPenColor(color) {
        if (!/^#[0-9a-fA-F]{6}$/.test(color)) {
          color = "#111111";
        }
        state.color = color;
        localStorage.setItem(colorKey, color);
        currentColorDot.style.background = color;
        customColorInput.value = color;
        for (const swatch of colorSwatches) {
          swatch.classList.toggle("active", swatch.dataset.color.toLowerCase() === color.toLowerCase());
        }
      }

      function setPenSize(size) {
        state.size = clamp(Number(size) || 5, 1, 36);
        localStorage.setItem(penSizeKey, String(state.size));
        penSizeInput.value = String(state.size);
        penSizeOutput.textContent = `${state.size}px`;
      }

      function normalizeDrawArea(area) {
        const minSize = 0.04;
        const normalized = {
          x: clamp(area.x, 0, 1 - minSize),
          y: clamp(area.y, 0, 1 - minSize),
          width: clamp(area.width, minSize, 1),
          height: clamp(area.height, minSize, 1),
        };
        if (normalized.x + normalized.width > 1) {
          normalized.width = 1 - normalized.x;
        }
        if (normalized.y + normalized.height > 1) {
          normalized.height = 1 - normalized.y;
        }
        return normalized;
      }

      function installDrawAreaEditor() {
        let edit = null;
        drawAreaOverlay.addEventListener("pointerdown", (event) => {
          if (!state.drawAreaEdit) {
            return;
          }
          event.preventDefault();
          event.stopPropagation();
          edit = {
            pointerId: event.pointerId,
            handle: event.target.dataset.handle || "move",
            startX: event.clientX,
            startY: event.clientY,
            area: { ...state.drawArea },
          };
          try {
            drawAreaOverlay.setPointerCapture(event.pointerId);
          } catch (_) {}
        });
        drawAreaOverlay.addEventListener("pointermove", (event) => {
          if (!edit || edit.pointerId !== event.pointerId) {
            return;
          }
          event.preventDefault();
          event.stopPropagation();
          const dx = ((event.clientX - edit.startX) * state.dpr) / Math.max(1, state.view.rect.width);
          const dy = ((event.clientY - edit.startY) * state.dpr) / Math.max(1, state.view.rect.height);
          const next = { ...edit.area };
          if (edit.handle === "move") {
            next.x += dx;
            next.y += dy;
          } else {
            if (edit.handle.includes("w")) {
              next.x += dx;
              next.width -= dx;
            }
            if (edit.handle.includes("e")) {
              next.width += dx;
            }
            if (edit.handle.includes("n")) {
              next.y += dy;
              next.height -= dy;
            }
            if (edit.handle.includes("s")) {
              next.height += dy;
            }
          }
          state.drawArea = normalizeDrawArea(next);
          updateDrawAreaOverlay();
        });
        const finish = (event) => {
          if (!edit || edit.pointerId !== event.pointerId) {
            return;
          }
          event.preventDefault();
          event.stopPropagation();
          saveDrawArea();
          edit = null;
        };
        drawAreaOverlay.addEventListener("pointerup", finish);
        drawAreaOverlay.addEventListener("pointercancel", finish);
      }

      function installFloatingToolButton(button) {
        let dragState = null;
        const dragThreshold = 8;

        button.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          event.stopPropagation();
          dragState = {
            pointerId: event.pointerId,
            startX: event.clientX,
            startY: event.clientY,
            dragging: false,
          };
          try {
            button.setPointerCapture(event.pointerId);
          } catch (_) {}
        });

        button.addEventListener("pointermove", (event) => {
          if (!dragState || event.pointerId !== dragState.pointerId) {
            return;
          }
          event.preventDefault();
          event.stopPropagation();
          const moved = Math.hypot(event.clientX - dragState.startX, event.clientY - dragState.startY);
          if (moved >= dragThreshold) {
            dragState.dragging = true;
            button.classList.add("dragging");
          }
          if (dragState.dragging) {
            updateToolPositionFromClient(button, event.clientX, event.clientY);
          }
        });

        button.addEventListener("pointerup", (event) => {
          if (!dragState || event.pointerId !== dragState.pointerId) {
            return;
          }
          event.preventDefault();
          event.stopPropagation();
          if (dragState.dragging) {
            updateToolPositionFromClient(button, event.clientX, event.clientY);
            saveFloatingSettings();
          } else {
            const key = floatingButtonKey(button);
            state.selectedControl = key;
            if (isScrollAction(button.dataset.action)) {
              sendRemoteWheelStepAt(event.clientX, event.clientY, event, button.dataset.action === "scrollUp" ? 120 : -120);
              applyFloatingSettings();
            } else if (button.dataset.tool) {
              setTool(button.dataset.tool);
            } else if (button.dataset.action === "undo") {
              undo();
              applyFloatingSettings();
            }
            if (!isScrollAction(button.dataset.action)) {
              sendRemoteClickAt(event.clientX, event.clientY, event);
            }
          }
          button.classList.remove("dragging");
          dragState = null;
        });

        button.addEventListener("pointercancel", (event) => {
          if (dragState && dragState.dragging) {
            saveFloatingSettings();
          }
          button.classList.remove("dragging");
          dragState = null;
          event.stopPropagation();
        });

        button.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
        });
      }

      function distance(left, right) {
        return Math.hypot(left.x - right.x, left.y - right.y);
      }

      canvas.addEventListener("pointerdown", handleCanvasPointerDown, { passive: false });
      canvas.addEventListener("pointermove", handleCanvasPointerMove, { passive: false });
      if ("onpointerrawupdate" in window) {
        canvas.addEventListener("pointerrawupdate", handleCanvasPointerMove, { passive: false });
      }
      canvas.addEventListener("pointerup", handleCanvasPointerEnd, { passive: false });
      canvas.addEventListener("pointercancel", handleCanvasPointerEnd, { passive: false });
      canvas.addEventListener("lostpointercapture", (event) => engine.forceFinish(event));

      for (const button of floatingButtons) {
        installFloatingToolButton(button);
      }
      installDrawAreaEditor();
      clearButton.addEventListener("click", clearAll);
      snapshotButton.addEventListener("click", loadSnapshot);
      streamButton.addEventListener("click", toggleScreenStream);
      hideSnapshotButton.addEventListener("click", toggleSnapshot);
      areaButton.addEventListener("click", () => setDrawAreaEdit(!state.drawAreaEdit));
      settingsButton.addEventListener("click", () => {
        settingsPanel.hidden = !settingsPanel.hidden;
        settingsButton.classList.toggle("active", !settingsPanel.hidden);
        applyFloatingSettings();
      });

      buttonSizeInput.addEventListener("input", (event) => updateFloatingSetting("size", event.target.value));
      toolbarOpacityInput.addEventListener("input", (event) => updateFloatingSetting("opacity", event.target.value));

      penSizeToggle.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        event.stopPropagation();
      });
      penSizeToggle.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        if (state.tool !== "pen") {
          return;
        }
        penSizePanel.hidden = !penSizePanel.hidden;
        positionPenSizePanel();
      });
      penSizeInput.addEventListener("pointerdown", (event) => event.stopPropagation());
      penSizeInput.addEventListener("pointermove", (event) => event.stopPropagation());
      penSizeInput.addEventListener("pointerup", (event) => event.stopPropagation());
      penSizeInput.addEventListener("input", (event) => setPenSize(event.target.value));

      colorButton.addEventListener("pointerdown", (event) => event.stopPropagation());
      colorButton.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        colorPanel.hidden = !colorPanel.hidden;
        colorButton.classList.toggle("active", !colorPanel.hidden);
      });
      for (const swatch of colorSwatches) {
        swatch.addEventListener("pointerdown", (event) => event.stopPropagation());
        swatch.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          setPenColor(swatch.dataset.color);
        });
      }
      customColorInput.addEventListener("pointerdown", (event) => event.stopPropagation());
      customColorInput.addEventListener("input", (event) => setPenColor(event.target.value));

      for (const control of toolbar.querySelectorAll("button")) {
        control.addEventListener("pointerdown", (event) => event.stopPropagation());
        control.addEventListener("pointerup", (event) => event.stopPropagation());
        control.addEventListener("pointercancel", (event) => event.stopPropagation());
      }

      for (const control of settingsPanel.querySelectorAll("input")) {
        control.addEventListener("pointerdown", (event) => event.stopPropagation());
        control.addEventListener("pointermove", (event) => event.stopPropagation());
        control.addEventListener("pointerup", (event) => event.stopPropagation());
      }

      window.addEventListener("resize", () => {
        resizeStage();
        applyFloatingSettings();
        updateDrawAreaOverlay();
      });
      window.addEventListener("orientationchange", () => {
        setTimeout(() => {
          resizeStage();
          applyFloatingSettings();
          updateDrawAreaOverlay();
        }, 180);
      });
      window.addEventListener("blur", (event) => {
        clearPendingTouchStart();
        touchPoints.clear();
        pinchState = null;
        engine.forceFinish(event);
      });
      window.addEventListener("beforeunload", () => disconnectScreenStream());
      document.addEventListener("visibilitychange", (event) => {
        if (document.hidden) {
          clearPendingTouchStart();
          touchPoints.clear();
          pinchState = null;
          engine.forceFinish(event);
        }
      });
      window.addEventListener("contextmenu", (event) => event.preventDefault());
      window.addEventListener("selectstart", (event) => event.preventDefault());
      window.addEventListener("dragstart", (event) => event.preventDefault());
      window.addEventListener("gesturestart", (event) => event.preventDefault());
      window.addEventListener("gesturechange", (event) => event.preventDefault());
      window.addEventListener("gestureend", (event) => event.preventDefault());

      updateHistoryButtons();
      resizeStage();
      applyFloatingSettings();
      setPenSize(state.size);
      setPenColor(state.color);
      redraw();
      transport.connect();
    </script>
  </body>
</html>
