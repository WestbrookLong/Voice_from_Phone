<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>移动端远程</title>
    <style>
      :root {
        --bg: #11130f;
        --panel: rgba(20, 24, 18, 0.82);
        --ink: #f6f0df;
        --muted: #b8b09f;
        --accent: #b6e36d;
        --danger: #ff725e;
      }

      * {
        box-sizing: border-box;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        color: var(--ink);
        background: radial-gradient(circle at 20% 10%, #28371d, transparent 30rem), var(--bg);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #screen {
        position: fixed;
        left: 0;
        top: var(--stage-top, 0px);
        width: var(--stage-width, 100vw);
        height: var(--stage-height, 100vh);
        display: block;
        background: #000;
        cursor: crosshair;
        touch-action: none;
      }

      #inkOverlay {
        position: fixed;
        left: 0;
        top: var(--stage-top, 0px);
        width: var(--stage-width, 100vw);
        height: var(--stage-height, 100vh);
        display: block;
        pointer-events: none;
        touch-action: none;
      }

      .hud {
        position: fixed;
        left: max(14px, env(safe-area-inset-left));
        top: max(14px, env(safe-area-inset-top));
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px 12px;
        border: 1px solid rgba(246, 240, 223, 0.16);
        border-radius: 999px;
        background: var(--panel);
        backdrop-filter: blur(16px);
        user-select: none;
        pointer-events: none;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--danger);
      }

      .dot.connected {
        background: var(--accent);
      }

      #status {
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .hint {
        position: fixed;
        left: max(14px, env(safe-area-inset-left));
        right: max(14px, env(safe-area-inset-right));
        bottom: max(14px, env(safe-area-inset-bottom));
        padding: 10px 12px;
        border-radius: 18px;
        color: var(--muted);
        background: var(--panel);
        backdrop-filter: blur(16px);
        font-size: 13px;
        line-height: 1.35;
        pointer-events: none;
      }

      body.keyboard-open .hint {
        display: none;
      }

      body.keyboard-open .hud {
        display: none;
      }

      body.keyboard-open .mode-button,
      body.keyboard-open .echo-button,
      body.keyboard-open .echo-clear-button {
        display: none;
      }

      .keyboard-button {
        position: fixed;
        right: max(16px, env(safe-area-inset-right));
        bottom: max(16px, env(safe-area-inset-bottom));
        z-index: 5;
        width: 62px;
        height: 62px;
        border: 1px solid rgba(246, 240, 223, 0.22);
        border-radius: 22px;
        color: var(--ink);
        background: rgba(182, 227, 109, 0.92);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.34);
        font-size: 28px;
        font-weight: 800;
        touch-action: manipulation;
      }

      .zoom-controls {
        position: fixed;
        right: max(16px, env(safe-area-inset-right));
        top: max(16px, env(safe-area-inset-top));
        z-index: 5;
        display: grid;
        gap: 8px;
        touch-action: manipulation;
      }

      .zoom-button {
        width: 54px;
        height: 54px;
        border: 1px solid rgba(246, 240, 223, 0.22);
        border-radius: 19px;
        color: #11130f;
        background: rgba(246, 240, 223, 0.9);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.34);
        font-size: 26px;
        font-weight: 950;
        line-height: 1;
        touch-action: manipulation;
      }

      .mode-button {
        position: fixed;
        left: max(16px, env(safe-area-inset-left));
        bottom: max(16px, env(safe-area-inset-bottom));
        z-index: 5;
        min-width: 108px;
        height: 54px;
        border: 1px solid rgba(246, 240, 223, 0.22);
        border-radius: 20px;
        padding: 0 16px;
        color: var(--ink);
        background: rgba(20, 24, 18, 0.86);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.34);
        font-size: 16px;
        font-weight: 900;
        touch-action: manipulation;
      }

      .mode-button.wheel {
        color: #11130f;
        background: rgba(182, 227, 109, 0.94);
      }

      .echo-button {
        position: fixed;
        left: max(138px, env(safe-area-inset-left) + 138px);
        bottom: max(16px, env(safe-area-inset-bottom));
        z-index: 5;
        min-width: 108px;
        height: 54px;
        border: 1px solid rgba(246, 240, 223, 0.22);
        border-radius: 20px;
        padding: 0 16px;
        color: var(--ink);
        background: rgba(20, 24, 18, 0.86);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.34);
        font-size: 16px;
        font-weight: 900;
        touch-action: manipulation;
      }

      .echo-button.on {
        color: #11130f;
        background: rgba(126, 214, 255, 0.94);
      }

      .echo-clear-button {
        position: fixed;
        left: max(262px, env(safe-area-inset-left) + 262px);
        bottom: max(16px, env(safe-area-inset-bottom));
        z-index: 5;
        min-width: 132px;
        height: 54px;
        border: 1px solid rgba(246, 240, 223, 0.22);
        border-radius: 20px;
        padding: 0 16px;
        color: var(--ink);
        background: rgba(20, 24, 18, 0.86);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.34);
        font-size: 16px;
        font-weight: 900;
        touch-action: manipulation;
      }

      .echo-clear-button.frame {
        color: #11130f;
        background: rgba(255, 210, 92, 0.94);
      }

      .input-panel {
        position: fixed;
        left: max(14px, env(safe-area-inset-left));
        right: max(14px, env(safe-area-inset-right));
        bottom: calc(max(86px, env(safe-area-inset-bottom) + 86px));
        z-index: 4;
        display: none;
        gap: 10px;
        padding: 12px;
        border: 1px solid rgba(246, 240, 223, 0.16);
        border-radius: 22px;
        background: var(--panel);
        backdrop-filter: blur(18px);
      }

      .input-panel.open {
        display: grid;
        grid-template-columns: 1fr auto auto;
        align-items: stretch;
      }

      body.keyboard-open .input-panel.open {
        bottom: max(6px, env(safe-area-inset-bottom));
      }

      #textInput {
        min-height: 52px;
        max-height: 130px;
        resize: vertical;
        border: 1px solid rgba(246, 240, 223, 0.16);
        border-radius: 16px;
        outline: none;
        padding: 10px 12px;
        color: var(--ink);
        background: rgba(0, 0, 0, 0.34);
        font-size: 18px;
        line-height: 1.35;
        -webkit-user-select: text;
        user-select: text;
      }

      .input-panel button {
        min-width: 62px;
        border: 1px solid rgba(246, 240, 223, 0.16);
        border-radius: 16px;
        color: var(--ink);
        background: rgba(246, 240, 223, 0.12);
        font-size: 15px;
        font-weight: 800;
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <canvas id="inkOverlay"></canvas>
    <div class="hud">
      <span id="dot" class="dot"></span>
      <span id="status">连接中</span>
    </div>
    <div class="hint">在电脑上打开 Photoshop 等绘图软件并选好工具。Apple Pencil 接触画面会映射为电脑鼠标按下和拖动。</div>
    <div id="inputPanel" class="input-panel">
      <textarea id="textInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="在这里输入，会注入到电脑当前文字光标处"></textarea>
      <button id="clearText" type="button">清空</button>
      <button id="closeKeyboard" type="button">收起</button>
    </div>
    <button id="keyboardButton" class="keyboard-button" type="button" aria-label="打开键盘">⌨</button>
    <div class="zoom-controls" aria-label="缩放控制">
      <button id="zoomInButton" class="zoom-button" type="button" aria-label="放大">+</button>
      <button id="zoomOutButton" class="zoom-button" type="button" aria-label="缩小">-</button>
    </div>
    <button id="modeButton" class="mode-button" type="button">点击模式</button>
    <button id="echoButton" class="echo-button" type="button">蒙版关</button>
    <button id="echoClearButton" class="echo-clear-button" type="button">自动淡出</button>

    <script>
      const canvas = document.querySelector("#screen");
      const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
      const inkCanvas = document.querySelector("#inkOverlay");
      const inkCtx = inkCanvas.getContext("2d", { alpha: true, desynchronized: true });
      const dot = document.querySelector("#dot");
      const statusEl = document.querySelector("#status");
      const keyboardButton = document.querySelector("#keyboardButton");
      const zoomInButton = document.querySelector("#zoomInButton");
      const zoomOutButton = document.querySelector("#zoomOutButton");
      const inputPanel = document.querySelector("#inputPanel");
      const textInput = document.querySelector("#textInput");
      const clearTextButton = document.querySelector("#clearText");
      const closeKeyboardButton = document.querySelector("#closeKeyboard");
      const modeButton = document.querySelector("#modeButton");
      const echoButton = document.querySelector("#echoButton");
      const echoClearButton = document.querySelector("#echoClearButton");
      const params = new URLSearchParams(location.search);
      const token = params.get("token") || "";
      const monitorId = params.get("monitor") || "1";
      const fps = params.get("fps") || "24";
      const quality = params.get("quality") || "58";
      const buildId = "tablet-20260428-portrait-backspace";

      let screenWs = null;
      let pointerWs = null;
      let textWs = null;
      let textSeq = 0;
      let lastSentText = "";
      let textQueue = [];
      let monitor = null;
      let imageRect = { left: 0, top: 0, width: 0, height: 0 };
      let zoomLevel = 1;
      let zoomCenter = { x: 0.5, y: 0.5 };
      let lastPointerRatio = { x: 0.5, y: 0.5 };
      let activePointerId = null;
      let activePointerType = null;
      let stageWidth = 0;
      let stageHeight = 0;
      let keyboardLayoutOpen = false;
      let layoutResizeTimer = null;
      let lastExplicitBackspaceAt = 0;
      const touches = new Map();
      let wheelMode = false;
      let forcedWheelMode = false;
      let localEchoEnabled = false;
      let echoClearMode = "fade";
      let hasPendingEcho = false;
      let echoFadeRunning = false;
      let activeEchoPoint = null;
      let activeEchoStroke = null;
      let localEchoStrokes = [];
      let screenFrameCounter = 0;
      let lastProcessedMove = null;
      let singleFingerWheelPointerId = null;
      let lastSingleFingerWheelY = null;
      let lastTwoFingerCenter = null;
      let wheelRemainder = 0;

      function setStatus(text, connected = false) {
        statusEl.textContent = `${text} | ${buildId}`;
        dot.classList.toggle("connected", connected);
      }

      function wsUrl(path, query = {}) {
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        const url = new URL(`${protocol}//${location.host}${path}`);
        url.searchParams.set("token", token);
        Object.entries(query).forEach(([key, value]) => url.searchParams.set(key, value));
        return url.toString();
      }

      function viewportMetrics() {
        const visualViewport = window.visualViewport;
        return {
          width: visualViewport ? visualViewport.width : window.innerWidth,
          height: visualViewport ? visualViewport.height : window.innerHeight,
          offsetTop: visualViewport ? visualViewport.offsetTop : 0,
        };
      }

      function resizeCanvas() {
        if (keyboardLayoutOpen) {
          const viewport = viewportMetrics();
          const panelHeight = inputPanel.classList.contains("open") ? inputPanel.getBoundingClientRect().height : 0;
          const reservedBottom = panelHeight + 10;
          const isPortrait = window.innerHeight >= window.innerWidth;
          const availableHeight = Math.max(160, Math.floor(viewport.height - reservedBottom));
          stageWidth = Math.max(1, Math.floor(viewport.width));
          if (isPortrait) {
            const screenAspectHeight = monitor
              ? Math.ceil(stageWidth * monitor.height / Math.max(1, monitor.width))
              : Math.ceil(stageWidth * 9 / 16);
            stageHeight = Math.max(availableHeight, screenAspectHeight);
            const stageTop = Math.floor(viewport.offsetTop + Math.min(0, availableHeight - stageHeight));
            document.documentElement.style.setProperty("--stage-top", `${stageTop}px`);
          } else {
            stageHeight = availableHeight;
            document.documentElement.style.setProperty("--stage-top", `${Math.max(0, Math.floor(viewport.offsetTop))}px`);
          }
          document.documentElement.style.setProperty("--stage-width", `${stageWidth}px`);
          document.documentElement.style.setProperty("--stage-height", `${stageHeight}px`);
        } else if (!stageWidth || !stageHeight) {
          stageWidth = window.innerWidth;
          stageHeight = window.innerHeight;
          document.documentElement.style.setProperty("--stage-top", "0px");
          document.documentElement.style.setProperty("--stage-width", `${stageWidth}px`);
          document.documentElement.style.setProperty("--stage-height", `${stageHeight}px`);
        }
        const dpr = window.devicePixelRatio || 1;
        const width = Math.floor(stageWidth * dpr);
        const height = Math.floor(stageHeight * dpr);
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }
        if (inkCanvas.width !== width || inkCanvas.height !== height) {
          inkCanvas.width = width;
          inkCanvas.height = height;
        }
      }

      function scheduleKeyboardLayoutUpdate() {
        resizeCanvas();
        if (layoutResizeTimer) {
          clearTimeout(layoutResizeTimer);
        }
        layoutResizeTimer = setTimeout(() => {
          resizeCanvas();
          layoutResizeTimer = null;
        }, 320);
      }

      function openKeyboardPanel() {
        keyboardLayoutOpen = true;
        document.body.classList.add("keyboard-open");
        inputPanel.classList.add("open");
        scheduleKeyboardLayoutUpdate();
        textInput.focus();
        setTimeout(scheduleKeyboardLayoutUpdate, 120);
        setTimeout(scheduleKeyboardLayoutUpdate, 420);
      }

      function closeKeyboardPanel() {
        keyboardLayoutOpen = false;
        document.body.classList.remove("keyboard-open");
        inputPanel.classList.remove("open");
        textInput.blur();
        stageWidth = 0;
        stageHeight = 0;
        resizeCanvas();
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function clampImageOffset(offset, viewSize, imageSize) {
        if (imageSize <= viewSize) {
          return (viewSize - imageSize) / 2;
        }
        return clamp(offset, viewSize - imageSize, 0);
      }

      function computeImageRect(imageWidth, imageHeight) {
        const viewWidth = canvas.width;
        const viewHeight = canvas.height;
        const scale = Math.min(viewWidth / imageWidth, viewHeight / imageHeight);
        const width = imageWidth * scale * zoomLevel;
        const height = imageHeight * scale * zoomLevel;
        const left = zoomLevel <= 1
          ? (viewWidth - width) / 2
          : clampImageOffset(viewWidth / 2 - zoomCenter.x * width, viewWidth, width);
        const top = zoomLevel <= 1
          ? (viewHeight - height) / 2
          : clampImageOffset(viewHeight / 2 - zoomCenter.y * height, viewHeight, height);
        imageRect = {
          left,
          top,
          width,
          height,
        };
      }

      async function drawFrame(blob) {
        screenFrameCounter += 1;
        resizeCanvas();
        const bitmap = await createImageBitmap(blob);
        computeImageRect(bitmap.width, bitmap.height);
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(bitmap, imageRect.left, imageRect.top, imageRect.width, imageRect.height);
        bitmap.close();
        if (localEchoEnabled && echoClearMode === "frame") {
          pruneFrameEchoStrokes();
          redrawFrameEchoStrokes();
        }
      }

      function connectScreen() {
        if (screenWs) {
          screenWs.close();
        }
        screenWs = new WebSocket(wsUrl("/screen", { monitor: monitorId, fps, quality }));
        screenWs.binaryType = "blob";

        screenWs.addEventListener("open", () => setStatus("屏幕已连接", true));
        screenWs.addEventListener("message", async (event) => {
          if (typeof event.data === "string") {
            const message = JSON.parse(event.data);
            if (message.type === "screen_meta") {
              monitor = message.monitor;
            }
            return;
          }
          await drawFrame(event.data);
        });
        screenWs.addEventListener("close", () => {
          setStatus("屏幕断开，重连中", false);
          setTimeout(connectScreen, 800);
        });
        screenWs.addEventListener("error", () => setStatus("屏幕连接错误", false));
      }

      function connectPointer() {
        if (pointerWs) {
          pointerWs.close();
        }
        pointerWs = new WebSocket(wsUrl("/pointer"));
        pointerWs.addEventListener("open", () => setStatus("已连接", true));
        pointerWs.addEventListener("close", () => {
          setStatus("输入断开，重连中", false);
          setTimeout(connectPointer, 800);
        });
        pointerWs.addEventListener("error", () => setStatus("输入连接错误", false));
      }

      function connectText() {
        if (textWs) {
          textWs.close();
        }
        textWs = new WebSocket(wsUrl("/ws"));
        textWs.addEventListener("open", () => {
          flushTextQueue();
        });
        textWs.addEventListener("close", () => {
          setTimeout(connectText, 800);
        });
      }

      function sendTextMessage(message) {
        if (!textWs || textWs.readyState !== WebSocket.OPEN) {
          textQueue.push(message);
          return;
        }
        textWs.send(JSON.stringify(message));
      }

      function flushTextQueue() {
        const pending = textQueue;
        textQueue = [];
        pending.forEach(sendTextMessage);
      }

      function syncTextInput() {
        if (textInput.value === lastSentText) {
          return;
        }
        lastSentText = textInput.value;
        sendTextMessage({
          type: "sync_text",
          token,
          seq: ++textSeq,
          text: textInput.value,
        });
      }

      function resetTextSession() {
        sendTextMessage({
          type: "reset_session",
          token,
          seq: ++textSeq,
        });
      }

      function sendExplicitBackspace() {
        sendTextMessage({
          type: "ops",
          token,
          seq: ++textSeq,
          ops: [{ type: "backspace", count: 1 }],
        });
      }

      function maybeSendEmptyBackspace(event) {
        const isKeyboardBackspace = event.key === "Backspace";
        const isInputBackspace = event.inputType === "deleteContentBackward";
        if (!isKeyboardBackspace && !isInputBackspace) {
          return;
        }
        if (textInput.value.length > 0 || textInput.selectionStart !== 0 || textInput.selectionEnd !== 0) {
          return;
        }
        const now = performance.now();
        if (now - lastExplicitBackspaceAt < 80) {
          event.preventDefault();
          return;
        }
        lastExplicitBackspaceAt = now;
        event.preventDefault();
        sendExplicitBackspace();
      }

      function eventToCanvasPoint(event) {
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) * dpr,
          y: (event.clientY - rect.top) * dpr,
        };
      }

      function eventToRatio(event) {
        const point = eventToCanvasPoint(event);
        const x = point.x;
        const y = point.y;
        const rx = (x - imageRect.left) / imageRect.width;
        const ry = (y - imageRect.top) / imageRect.height;
        return {
          x: Math.max(0, Math.min(1, rx)),
          y: Math.max(0, Math.min(1, ry)),
        };
      }

      function setZoom(nextZoom) {
        const previousZoom = zoomLevel;
        zoomLevel = Math.round(clamp(nextZoom, 1, 4) * 100) / 100;
        if (zoomLevel === previousZoom) {
          return;
        }
        zoomCenter = { ...lastPointerRatio };
        resetLocalEcho();
      }

      function drawLocalEcho(from, to) {
        if (!localEchoEnabled || forcedWheelMode) {
          return;
        }
        inkCtx.save();
        inkCtx.lineCap = "round";
        inkCtx.lineJoin = "round";
        inkCtx.strokeStyle = "rgba(126, 214, 255, 0.82)";
        inkCtx.lineWidth = Math.max(3, 4 * (window.devicePixelRatio || 1));
        inkCtx.beginPath();
        inkCtx.moveTo(from.x, from.y);
        inkCtx.lineTo(to.x, to.y);
        inkCtx.stroke();
        inkCtx.restore();
        hasPendingEcho = true;
        if (echoClearMode === "frame" && activeEchoStroke) {
          activeEchoStroke.segments.push({ from, to });
        }
      }

      function renderLocalEchoDot(point) {
        const radius = Math.max(2.2, 2.8 * (window.devicePixelRatio || 1));
        inkCtx.save();
        inkCtx.fillStyle = "rgba(126, 214, 255, 0.82)";
        inkCtx.beginPath();
        inkCtx.arc(point.x, point.y, radius, 0, Math.PI * 2);
        inkCtx.fill();
        inkCtx.restore();
      }

      function drawLocalEchoDot(point) {
        if (!localEchoEnabled || forcedWheelMode) {
          return;
        }
        renderLocalEchoDot(point);
        hasPendingEcho = true;
        if (echoClearMode === "frame" && activeEchoStroke) {
          activeEchoStroke.segments.push({ from: point, to: point, dot: true });
        }
      }

      function startLocalEchoStroke(point) {
        activeEchoPoint = point;
        if (!localEchoEnabled || forcedWheelMode) {
          return;
        }
        if (echoClearMode === "frame") {
          activeEchoStroke = {
            segments: [],
            endFrame: null,
          };
          localEchoStrokes.push(activeEchoStroke);
        }
        drawLocalEchoDot(point);
      }

      function endLocalEchoStroke() {
        activeEchoPoint = null;
        if (activeEchoStroke) {
          activeEchoStroke.endFrame = screenFrameCounter;
          activeEchoStroke = null;
        }
      }

      function forceEndActivePointer(event) {
        if (activePointerId === null) {
          return;
        }
        sendPointer("up", event);
        try {
          canvas.releasePointerCapture(activePointerId);
        } catch (_) {
          // Safari may release capture implicitly or reject stale ids.
        }
        activePointerId = null;
        activePointerType = null;
        endLocalEchoStroke();
      }

      function drawEchoSegment(segment) {
        if (segment.dot) {
          renderLocalEchoDot(segment.from);
          return;
        }
        inkCtx.save();
        inkCtx.lineCap = "round";
        inkCtx.lineJoin = "round";
        inkCtx.strokeStyle = "rgba(126, 214, 255, 0.82)";
        inkCtx.lineWidth = Math.max(3, 4 * (window.devicePixelRatio || 1));
        inkCtx.beginPath();
        inkCtx.moveTo(segment.from.x, segment.from.y);
        inkCtx.lineTo(segment.to.x, segment.to.y);
        inkCtx.stroke();
        inkCtx.restore();
      }

      function pruneFrameEchoStrokes() {
        localEchoStrokes = localEchoStrokes.filter((stroke) => {
          if (stroke === activeEchoStroke || stroke.endFrame === null) {
            return true;
          }
          return screenFrameCounter - stroke.endFrame < 3;
        });
        hasPendingEcho = localEchoStrokes.length > 0;
      }

      function redrawFrameEchoStrokes() {
        inkCtx.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
        for (const stroke of localEchoStrokes) {
          for (const segment of stroke.segments) {
            drawEchoSegment(segment);
          }
        }
      }

      function fadeLocalEcho() {
        if (!localEchoEnabled || echoClearMode !== "fade") {
          echoFadeRunning = false;
          return;
        }
        inkCtx.save();
        inkCtx.globalCompositeOperation = "destination-out";
        inkCtx.fillStyle = "rgba(0, 0, 0, 0.055)";
        inkCtx.fillRect(0, 0, inkCanvas.width, inkCanvas.height);
        inkCtx.restore();
        requestAnimationFrame(fadeLocalEcho);
      }

      function clearLocalEchoPixels() {
        inkCtx.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
        hasPendingEcho = false;
        localEchoStrokes = [];
        activeEchoStroke = null;
      }

      function resetLocalEcho() {
        clearLocalEchoPixels();
        activeEchoPoint = null;
      }

      function setLocalEcho(enabled) {
        localEchoEnabled = enabled;
        echoButton.textContent = enabled ? "蒙版开" : "蒙版关";
        echoButton.classList.toggle("on", enabled);
        resetLocalEcho();
        if (enabled && echoClearMode === "fade" && !echoFadeRunning) {
          echoFadeRunning = true;
          requestAnimationFrame(fadeLocalEcho);
        }
      }

      function setEchoClearMode(mode) {
        echoClearMode = mode;
        echoClearButton.textContent = mode === "frame" ? "等屏幕响应" : "自动淡出";
        echoClearButton.classList.toggle("frame", mode === "frame");
        resetLocalEcho();
        if (localEchoEnabled && mode === "fade" && !echoFadeRunning) {
          echoFadeRunning = true;
          requestAnimationFrame(fadeLocalEcho);
        }
      }

      function sendPointer(action, event) {
        if (!monitor || !pointerWs || pointerWs.readyState !== WebSocket.OPEN) {
          return;
        }
        const point = eventToRatio(event);
        lastPointerRatio = point;
        pointerWs.send(JSON.stringify({
          type: "pointer",
          token,
          action,
          x: point.x,
          y: point.y,
          pressure: event.pressure || 0,
          pointerType: event.pointerType,
          monitor,
        }));
      }

      function sendWheel(delta) {
        if (!monitor || !pointerWs || pointerWs.readyState !== WebSocket.OPEN) {
          return;
        }
        pointerWs.send(JSON.stringify({
          type: "pointer",
          token,
          action: "wheel",
          x: 0.5,
          y: 0.5,
          delta,
          monitor,
        }));
      }

      function shouldProcessMove(event) {
        const now = performance.now();
        if (
          lastProcessedMove &&
          lastProcessedMove.pointerId === event.pointerId &&
          lastProcessedMove.x === event.clientX &&
          lastProcessedMove.y === event.clientY &&
          now - lastProcessedMove.time < 8
        ) {
          return false;
        }
        lastProcessedMove = {
          pointerId: event.pointerId,
          x: event.clientX,
          y: event.clientY,
          time: now,
        };
        return true;
      }

      function processActivePointerMove(event) {
        if (!shouldProcessMove(event)) {
          return;
        }
        const point = eventToCanvasPoint(event);
        if (activeEchoPoint) {
          drawLocalEcho(activeEchoPoint, point);
        }
        activeEchoPoint = point;
        sendPointer("move", event);
      }

      function twoFingerCenter() {
        if (touches.size !== 2) {
          return null;
        }
        const points = Array.from(touches.values());
        return {
          x: (points[0].clientX + points[1].clientX) / 2,
          y: (points[0].clientY + points[1].clientY) / 2,
        };
      }

      function updateWheelFromTouches() {
        if (!wheelMode) {
          return;
        }
        const center = twoFingerCenter();
        if (!center) {
          return;
        }
        if (!lastTwoFingerCenter) {
          lastTwoFingerCenter = center;
          return;
        }

        const dy = center.y - lastTwoFingerCenter.y;
        lastTwoFingerCenter = center;
        wheelRemainder += dy * 5;

        const step = 120;
        if (Math.abs(wheelRemainder) >= step) {
          const delta = Math.trunc(wheelRemainder / step) * step;
          wheelRemainder -= delta;
          sendWheel(delta);
        }
      }

      function updateWheelFromSingleTouch(event) {
        if (lastSingleFingerWheelY === null) {
          lastSingleFingerWheelY = event.clientY;
          return;
        }
        const dy = event.clientY - lastSingleFingerWheelY;
        lastSingleFingerWheelY = event.clientY;
        wheelRemainder += dy * 5;

        const step = 120;
        if (Math.abs(wheelRemainder) >= step) {
          const delta = Math.trunc(wheelRemainder / step) * step;
          wheelRemainder -= delta;
          sendWheel(delta);
        }
      }

      function setForcedWheelMode(enabled) {
        forcedWheelMode = enabled;
        modeButton.textContent = enabled ? "滚轮模式" : "点击模式";
        modeButton.classList.toggle("wheel", enabled);
        forceEndActivePointer({ clientX: 0, clientY: 0, pressure: 0, pointerType: activePointerType || "touch" });
        touches.clear();
        wheelMode = false;
        singleFingerWheelPointerId = null;
        lastSingleFingerWheelY = null;
        lastTwoFingerCenter = null;
        wheelRemainder = 0;
      }

      canvas.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        if (event.pointerType === "touch") {
          if (forcedWheelMode) {
            singleFingerWheelPointerId = event.pointerId;
            lastSingleFingerWheelY = event.clientY;
            wheelRemainder = 0;
            canvas.setPointerCapture(event.pointerId);
            sendPointer("move", event);
            return;
          }
          touches.set(event.pointerId, { clientX: event.clientX, clientY: event.clientY });
          if (touches.size === 2) {
            forceEndActivePointer(event);
            wheelMode = true;
            lastTwoFingerCenter = twoFingerCenter();
            wheelRemainder = 0;
            return;
          }
          if (touches.size === 1 && !wheelMode) {
            forceEndActivePointer(event);
            activePointerId = event.pointerId;
            activePointerType = "touch";
            startLocalEchoStroke(eventToCanvasPoint(event));
            canvas.setPointerCapture(event.pointerId);
            sendPointer("down", event);
            return;
          }
          return;
        }
        if (wheelMode) {
          return;
        }
        forceEndActivePointer(event);
        activePointerId = event.pointerId;
        activePointerType = event.pointerType;
        startLocalEchoStroke(eventToCanvasPoint(event));
        canvas.setPointerCapture(event.pointerId);
        sendPointer("down", event);
      });

      function handlePointerMove(event) {
        event.preventDefault();
        if (event.pointerType === "touch") {
          if (forcedWheelMode) {
            if (event.pointerId === singleFingerWheelPointerId) {
              sendPointer("move", event);
              updateWheelFromSingleTouch(event);
            }
            return;
          }
          if (touches.has(event.pointerId)) {
            touches.set(event.pointerId, { clientX: event.clientX, clientY: event.clientY });
          }
          if (wheelMode) {
            updateWheelFromTouches();
            return;
          }
          if (event.pointerId === activePointerId) {
            processActivePointerMove(event);
          }
          return;
        }
        if (event.pointerId !== activePointerId) {
          return;
        }
        const events = event.getCoalescedEvents ? event.getCoalescedEvents() : [event];
        for (const item of events) {
          processActivePointerMove(item);
        }
      }

      canvas.addEventListener("pointermove", handlePointerMove);
      if ("onpointerrawupdate" in window) {
        canvas.addEventListener("pointerrawupdate", handlePointerMove);
      }

      function endPointer(event) {
        event.preventDefault();
        if (event.pointerType === "touch") {
          if (forcedWheelMode) {
            if (event.pointerId === singleFingerWheelPointerId) {
              singleFingerWheelPointerId = null;
              lastSingleFingerWheelY = null;
              wheelRemainder = 0;
            }
            return;
          }
          const wasActivePointer = event.pointerId === activePointerId;
          if (wasActivePointer) {
            sendPointer("up", event);
            try {
              canvas.releasePointerCapture(event.pointerId);
            } catch (_) {
              // Safari may release capture implicitly.
            }
            activePointerId = null;
            activePointerType = null;
            endLocalEchoStroke();
          }
          touches.delete(event.pointerId);
          if (touches.size < 2) {
            wheelMode = false;
            lastTwoFingerCenter = null;
            wheelRemainder = 0;
          }
          return;
        }
        if (event.pointerId !== activePointerId) {
          return;
        }
        sendPointer("up", event);
        try {
          canvas.releasePointerCapture(event.pointerId);
        } catch (_) {
          // Safari may release capture implicitly.
        }
        activePointerId = null;
        activePointerType = null;
        endLocalEchoStroke();
      }

      canvas.addEventListener("pointerup", endPointer);
      canvas.addEventListener("pointercancel", endPointer);
      window.addEventListener("orientationchange", () => {
        stageWidth = 0;
        stageHeight = 0;
        setTimeout(resizeCanvas, 250);
      });
      window.addEventListener("resize", () => {
        if (keyboardLayoutOpen) {
          scheduleKeyboardLayoutUpdate();
        }
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", () => {
          if (keyboardLayoutOpen) {
            scheduleKeyboardLayoutUpdate();
          }
        });
        window.visualViewport.addEventListener("scroll", () => {
          if (keyboardLayoutOpen) {
            scheduleKeyboardLayoutUpdate();
          }
        });
      }
      window.addEventListener("contextmenu", (event) => event.preventDefault());
      window.addEventListener("selectstart", (event) => {
        if (event.target !== textInput) {
          event.preventDefault();
        }
      });
      window.addEventListener("dragstart", (event) => event.preventDefault());
      window.addEventListener("gesturestart", (event) => event.preventDefault());
      window.addEventListener("gesturechange", (event) => event.preventDefault());
      window.addEventListener("gestureend", (event) => event.preventDefault());

      keyboardButton.addEventListener("pointerdown", (event) => event.stopPropagation());
      keyboardButton.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        openKeyboardPanel();
      });

      zoomInButton.addEventListener("pointerdown", (event) => event.stopPropagation());
      zoomInButton.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        setZoom(zoomLevel + 0.35);
      });

      zoomOutButton.addEventListener("pointerdown", (event) => event.stopPropagation());
      zoomOutButton.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        setZoom(zoomLevel - 0.35);
      });

      textInput.addEventListener("pointerdown", (event) => event.stopPropagation());
      textInput.addEventListener("keydown", maybeSendEmptyBackspace);
      textInput.addEventListener("beforeinput", maybeSendEmptyBackspace);
      textInput.addEventListener("input", syncTextInput);

      clearTextButton.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        textInput.value = "";
        lastSentText = "";
        resetTextSession();
        textInput.focus();
      });

      closeKeyboardButton.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        closeKeyboardPanel();
      });

      modeButton.addEventListener("pointerdown", (event) => event.stopPropagation());
      modeButton.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        setForcedWheelMode(!forcedWheelMode);
      });

      echoButton.addEventListener("pointerdown", (event) => event.stopPropagation());
      echoButton.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        setLocalEcho(!localEchoEnabled);
      });

      echoClearButton.addEventListener("pointerdown", (event) => event.stopPropagation());
      echoClearButton.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        setEchoClearMode(echoClearMode === "fade" ? "frame" : "fade");
      });

      resizeCanvas();
      connectScreen();
      connectPointer();
      connectText();
    </script>
  </body>
</html>
